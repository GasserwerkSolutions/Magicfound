      function appointmentRow(appointment) {
        const member = staff.find(person => person.id === appointment.staff);
        return `<button type="button" class="appointment-row" data-appointment="${appointment.id}"><span class="time">${appointment.start}</span><span><strong>${appointment.customer}</strong><small>${appointment.service} · ${member.name}</small></span><span class="status-chip ${appointment.status}">${statusLabel(appointment.status)}</span></button>`;
      }

      function renderDay() {
        const appointments = visibleAppointments();
        if (!appointments.length) {
          return `<section class="screen paper-surface day-shell"><div class="day-toolbar">${dateControls()}<span class="day-summary">Keine Termine geplant</span></div><div class="empty-state"><div><div class="empty-illustration"><span class="empty-marmot"></span></div><h2>Dein Tag ist noch frei.</h2><p class="muted">Füge einen Termin hinzu oder geniesse die Aussicht.</p><button class="button primary" type="button" data-quick-book>${icons.plus} Termin eintragen</button></div></div>${dayFooter()}</section>`;
        }
        const people = visibleStaff();
        const startMinutes = state.dayPart === "afternoon" ? 720 : 480;
        const endMinutes = state.dayPart === "full" ? 1080 : state.dayPart === "afternoon" ? 1080 : 840;
        const hours = [];
        for (let minute = startMinutes; minute <= endMinutes; minute += 60) hours.push(minute);
        const range = endMinutes - startMinutes;
        const columns = people.map(person => {
          const cards = appointments.filter(appointment => appointment.staff === person.id && timeToMinutes(appointment.start) + appointment.duration > startMinutes && timeToMinutes(appointment.start) < endMinutes).map(appointment => dayAppointment(appointment, startMinutes, range)).join("");
          return `<div class="staff-column"><div class="column-head"><span class="staff-avatar">${person.name[0]}</span><span class="staff-name"><strong>${person.name} ${person.surname}</strong><small>${person.role}</small></span></div><div class="grid-hours"></div>${cards}</div>`;
        }).join("");
        const timeLabels = hours.map(minute => `<span class="time-label" style="top:calc(68px + ${(minute - startMinutes) / range * 702}px)">${minutesToTime(minute)}</span>`).join("");
        const nowTop = Math.max(0, Math.min(1, (11 * 60 + 22 - startMinutes) / range)) * 702 + 68;
        return `<section class="screen paper-surface day-shell">
          <div class="day-toolbar">${dateControls()}<span class="day-summary"><strong>${appointments.length} Termine</strong> · Zürich Enge</span><span id="staff-range" class="staff-range">${people.length} Mitarbeitende</span></div>
          <div class="day-viewport-wrap"><div class="day-viewport" id="day-viewport"><div class="day-grid" style="--staff-count:${people.length};min-width:${70 + people.length * 122}px"><div class="time-column"><div class="column-head">Zeit</div><div class="grid-hours"></div>${timeLabels}</div>${columns}<div class="now-line" style="top:${nowTop}px"></div></div></div><button class="scroll-hint left" type="button" data-scroll-day="-1" aria-label="Frühere Mitarbeitende anzeigen">${icons.back}</button><button class="scroll-hint right" type="button" data-scroll-day="1" aria-label="Weitere Mitarbeitende anzeigen">${icons.next}</button></div>
          ${dayFooter()}
        </section>`;
      }

      function dateControls() {
        return `<div class="date-stepper"><button class="button compact icon-button" type="button" data-demo-action="Vorheriger Tag" aria-label="Vorheriger Tag">${icons.back}</button><button class="button compact date-button" type="button" data-demo-action="Datum auswählen">Do, 20. August 2026</button><button class="button compact icon-button" type="button" data-demo-action="Nächster Tag" aria-label="Nächster Tag">${icons.next}</button></div>`;
      }

      function dayAppointment(appointment, startMinutes, range) {
        const start = timeToMinutes(appointment.start);
        const visibleStart = Math.max(start, startMinutes);
        const visibleEnd = Math.min(start + appointment.duration, startMinutes + range);
        const top = 68 + ((visibleStart - startMinutes) / range) * 702;
        const height = Math.max(40, ((visibleEnd - visibleStart) / range) * 702 - 4);
        const query = state.search.trim().toLocaleLowerCase("de-CH");
        const match = query && `${appointment.customer} ${appointment.service}`.toLocaleLowerCase("de-CH").includes(query);
        const dimmed = query && !match;
        return `<button type="button" class="appointment-card status-${appointment.status} ${match ? "is-search-hit" : ""} ${dimmed ? "is-dimmed" : ""} ${state.selectedId === appointment.id ? "is-selected" : ""}" style="top:${top}px;height:${height}px" data-appointment="${appointment.id}" aria-label="${appointment.start}, ${appointment.customer}, ${appointment.service}, ${statusLabel(appointment.status)}"><span class="appt-time">${appointment.start}–${minutesToTime(start + appointment.duration)}</span><strong>${appointment.customer}</strong><span class="appt-service">${appointment.service}</span></button>`;
      }

      function dayFooter() {
        return `<div class="day-footer"><div class="segment"><button type="button" class="${state.dayPart === "morning" ? "is-active" : ""}" data-day-part="morning">Vormittag</button><button type="button" class="${state.dayPart === "afternoon" ? "is-active" : ""}" data-day-part="afternoon">Nachmittag</button><button type="button" class="${state.dayPart === "full" ? "is-active" : ""}" data-day-part="full">Ganzer Tag</button></div><div class="legend"><span><i></i>Bestätigt</span><span><i style="background:var(--amber)"></i>Angefragt</span><span><i style="background:var(--violet)"></i>Im Salon</span><span><i style="background:#6d7975"></i>Abgeschlossen</span><span><i style="background:var(--red)"></i>Nicht erschienen</span></div></div>`;
      }

      function renderBookings() {
        const appointments = visibleAppointments();
        return `<section class="screen">
          <div class="filter-row"><select class="filter-select"><option>Alle Status</option><option>Bestätigt</option><option>Im Salon</option><option>Abgeschlossen</option></select><select class="filter-select"><option>Zürich Enge</option><option>Alle Standorte</option></select><button class="button compact" type="button" data-demo-action="Zeitraum wählen">20.–27. August</button><span class="muted">${appointments.length} Einträge</span></div>
          <div class="paper-surface table-wrap">${appointments.length ? `<table class="data-table"><thead><tr><th>Zeit</th><th>Kundschaft</th><th>Leistung</th><th>Mitarbeitende</th><th>Status</th></tr></thead><tbody>${appointments.map(appointment => { const person = staff.find(member => member.id === appointment.staff); return `<tr data-appointment="${appointment.id}" tabindex="0"><td><strong>20. Aug.</strong><small>${appointment.start}</small></td><td><strong>${appointment.customer}</strong><small>${appointment.phone}</small></td><td>${appointment.service}</td><td>${person.name} ${person.surname}</td><td><span class="status-chip ${appointment.status}">${statusLabel(appointment.status)}</span></td></tr>`; }).join("")}</tbody></table>` : `<div class="empty-state"><div><h2>Noch keine Buchungen</h2><p class="muted">Sobald ein Termin eingetragen wird, erscheint er in diesem Register.</p><button class="button primary" type="button" data-quick-book>${icons.plus} Buchung eintragen</button></div></div>`}</div>
        </section>`;
      }

      function renderCustomers() {
        const active = customers[state.selectedCustomer];
        return `<section class="screen paper-surface split-view">
          <div class="split-list"><div class="card-head"><div><h2>Kundschaft</h2><span class="muted">Beziehung und nächster Schritt</span></div></div>${customers.map((customer, index) => `<button type="button" class="customer-row ${index === state.selectedCustomer ? "is-active" : ""}" data-customer="${index}"><span class="avatar">${customer.name.split(" ").map(word => word[0]).join("")}</span><span><strong>${customer.name}</strong><small>${customer.phone}</small></span><span class="muted">${customer.visits}</span></button>`).join("")}</div>
          <div class="split-detail"><div class="detail-heading"><div><div class="eyebrow">Kundenprofil</div><h2>${active.name}</h2><span class="muted">${active.phone}</span></div><button class="button primary" type="button" data-customer-book>${icons.plus} Termin</button></div>
            <div class="detail-grid"><div class="detail-stat"><span>Besuche</span><strong>${active.visits}</strong></div><div class="detail-stat"><span>Umsatz</span><strong>CHF ${active.revenue.toLocaleString("de-CH")}</strong></div><div class="detail-stat"><span>Letzter Termin</span><strong>${active.last}</strong></div><div class="detail-stat"><span>Kontakt</span><strong>SMS erlaubt</strong></div></div>
            <div class="section-card"><div class="eyebrow">Salonnotiz</div><p style="margin:5px 0 0">${active.note}</p></div>
            <h3 style="margin-top:20px">Verlauf</h3><div class="history-item"><strong>Schnitt & Föhnen · CHF 104</strong><small>${active.last} · Melanie Schneider</small></div><div class="history-item"><strong>Terminbestätigung per SMS</strong><small>Erfolgreich zugestellt</small></div>
          </div>
        </section>`;
      }

      function renderTeam() {
        return `<section class="screen"><div class="filter-row"><span class="status-chip confirmed">10 aktiv</span><span class="muted">Person, Rolle, Standort und Arbeitszeit werden nur hier gepflegt.</span></div><div class="people-grid">${visibleStaff().map(person => `<article class="person-card"><div class="person-card-head"><span class="avatar">${person.name[0]}${person.surname[0]}</span><div><h3>${person.name} ${person.surname}</h3><span class="muted">${person.role}</span></div></div><p>Zürich Enge · Arbeitszeit vollständig</p><div class="schedule-strip"><span class="on">Mo</span><span class="on">Di</span><span class="on">Mi</span><span class="on">Do</span><span class="on">Fr</span><span>Sa</span><span>So</span></div><button class="button compact" type="button" data-demo-action="${person.name} bearbeiten" style="margin-top:13px">Bearbeiten</button></article>`).join("")}</div></section>`;
      }

      function renderOffer() {
        return `<section class="screen"><div class="filter-row"><span class="status-chip confirmed">18 aktiv</span><span class="muted">Leistung, Dauer, Preis und Zuordnung zu bestehenden Personen.</span></div><div class="service-grid">${services.map(service => `<article class="service-card"><span class="service-price">CHF ${service.price}</span><div class="eyebrow">Dienstleistung</div><h3>${service.name}</h3><p>${service.duration} Minuten · online buchbar</p><div class="service-meta"><span class="status-chip confirmed">Aktiv</span><span class="status-chip">${service.team.length} Personen</span></div><div class="assignment-list">${service.team.map(initials => `<span class="mini-avatar">${initials}</span>`).join("")}</div><button class="button compact" type="button" data-demo-action="${service.name} bearbeiten" style="margin-top:14px">Bearbeiten</button></article>`).join("")}</div></section>`;
      }

      function renderAdmin() {
        const cards = [["Salonprofil", "Adresse, Kontakt und rechtliche Angaben des Salons."], ["Marke", "Logo und salonbezogene Akzente, getrennt von der Gasserwerk-Shell."], ["Standorte", "Zürich Enge und künftige Filialen verwalten."], ["Integrationen", "Kalender, Kommunikation und angebundene Dienste."], ["Rollen & Zugriff", "Fähigkeiten für Inhaberin, Leitung, Mitarbeitende und Lesende."], ["Plan & Abrechnung", "Eigentümergebundene Vertrags- und Rechnungsangaben."]];
        return `<section class="screen"><div class="admin-grid">${cards.map(([title, copy], index) => `<article class="admin-card"><div class="eyebrow">${index === 5 ? "Nur Inhaberin" : "Verwaltung"}</div><h3>${title}</h3><p>${copy}</p><button class="button compact" type="button" data-demo-action="${title} öffnen">Öffnen</button></article>`).join("")}</div></section>`;
      }

      function bindScreenEvents() {
        document.querySelectorAll("[data-appointment]").forEach(node => {
          node.addEventListener("click", () => openAppointment(node.dataset.appointment, node));
          node.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") openAppointment(node.dataset.appointment, node); });
        });
        document.querySelectorAll("[data-nav-inline]").forEach(node => node.addEventListener("click", () => navigate(node.dataset.navInline)));
        document.querySelectorAll("[data-day-part]").forEach(node => node.addEventListener("click", () => { state.dayPart = node.dataset.dayPart; render(); }));
        document.querySelectorAll("[data-customer]").forEach(node => node.addEventListener("click", () => { state.selectedCustomer = Number(node.dataset.customer); render(); }));
        document.querySelectorAll("[data-step]").forEach(node => node.addEventListener("click", () => { state.onboardingStep = Number(node.dataset.step); render(); }));
        document.querySelectorAll("[data-step-back]").forEach(node => node.addEventListener("click", () => { state.onboardingStep = Math.max(0, state.onboardingStep - 1); render(); }));
        document.querySelectorAll("[data-step-next]").forEach(node => node.addEventListener("click", () => { if (state.onboardingStep >= 4) navigate("today"); else { state.onboardingStep += 1; render(); } }));
        document.querySelectorAll("[data-quick-book]").forEach(node => node.addEventListener("click", () => openPrototypeBooking()));
        document.querySelectorAll("[data-customer-book]").forEach(node => node.addEventListener("click", () => openPrototypeBooking(customers[state.selectedCustomer]?.name)));
        document.querySelectorAll("[data-demo-action]").forEach(node => node.addEventListener("click", () => toast("Im Designprototyp simuliert", `${node.dataset.demoAction} hat keine Produktionswirkung.`)));
        const login = el("prototype-login");
        if (login) login.addEventListener("submit", event => { event.preventDefault(); toast("Anmeldung simuliert", "Der sichere Zielkontext Heute wurde wiederhergestellt."); navigate("today"); });
      }

      function openPrototypeBooking(customer = "") {
        state.origin = { screen: state.screen, search: state.search, scrollTop: workspaceBody.scrollTop, dayScrollLeft: el("day-viewport")?.scrollLeft || 0, dayScrollTop: el("day-viewport")?.scrollTop || 0, focusId: null };
        state.panelOrigin = null;
        state.panelView = "booking";
        state.selectedId = null;
        panel.innerHTML = panelFrame("Buchung eintragen", `<div class="notice"><strong>Designprototyp</strong><br>Dieser Editor simuliert den gemeinsamen Abschluss verschiedener Buchungseinstiege.</div><div class="form-field"><label>Kundin</label><input value="${customer}" placeholder="Vor- und Nachname"></div><div class="form-field"><label>Leistung</label><select class="filter-select" style="width:100%"><option>Schnitt & Föhnen · 75 Min.</option><option>Farbe & Pflege · 90 Min.</option><option>Balayage & Glossing · 150 Min.</option></select></div><div class="form-field"><label>Zeit</label><input type="time" value="14:15"></div>`, `<button class="button" type="button" data-panel-close>Abbrechen</button><button class="button primary" type="button" data-booking-success>Termin simulieren</button>`);
        openPanel();
        panel.querySelector("[data-booking-success]").addEventListener("click", () => showSuccess("Termin eingetragen", `${customer || "Neue Kundin"} ist am 20. August um 14:15 im Tagesplan eingetragen.`, "Zum Tagesplan"));
      }

      function openAppointment(id, trigger) {
        state.selectedId = id;
        const dayViewport=el("day-viewport");
        state.origin={screen:state.screen,search:state.search,scrollTop:workspaceBody.scrollTop,dayScrollLeft:dayViewport?.scrollLeft||0,dayScrollTop:dayViewport?.scrollTop||0,focusId:id};
        state.panelView="detail";
        if(trigger){
          const rect=trigger.getBoundingClientRect(),panelWidth=Math.min(455,window.innerWidth-32),panelLeft=window.innerWidth-16-panelWidth;
          state.panelOrigin={x:Math.max(-420,Math.min(420,rect.left-panelLeft)),y:Math.max(-420,Math.min(420,rect.top-58)),originX:Math.max(0,rect.left-panelLeft),originY:Math.max(0,rect.top-58)};
        }
        renderAppointmentPanel();
        openPanel();
        if(trigger)trigger.classList.add("is-selected");
      }

      function renderAppointmentPanel() {
        const appointment = selectedAppointment();
        if (!appointment) return;
        const person = staff.find(member => member.id === appointment.staff);
        const activeActions = !["cancelled", "no-show"].includes(appointment.status);
        const visitAction = appointment.status === "arrived" ? `<button class="action-row" type="button" data-panel-action="visit"><span><strong>Nächster Visit-Schritt</strong><small>${visitNextLabel(appointment)}</small></span><span>→</span></button>` : appointment.status === "confirmed" ? `<button class="action-row" type="button" data-panel-action="arrival"><span><strong>Ankunft bestätigen</strong><small>Sicher erfassen, auch bei erneutem Tippen</small></span><span>→</span></button>` : "";
        const body = `<div class="appointment-hero"><span class="status-chip ${appointment.status}">${statusLabel(appointment.status)}</span><h3>${appointment.customer}</h3><p>${appointment.start}–${minutesToTime(timeToMinutes(appointment.start) + appointment.duration)} · ${appointment.service}</p></div>
          <div class="facts"><div class="fact"><span>Mitarbeitende</span><strong>${person.name} ${person.surname}</strong></div><div class="fact"><span>Standort</span><strong>Zürich Enge</strong></div><div class="fact"><span>Kontakt</span><strong>${appointment.phone}</strong></div><div class="fact"><span>Preis</span><strong>CHF ${appointment.price}</strong></div></div>
          <div class="notice"><strong>Salonhinweis</strong><br>${appointment.note}</div>
          <div class="action-group">${visitAction}${activeActions ? `<button class="action-row" type="button" data-panel-action="reschedule"><span><strong>Termin verschieben</strong><small>Kundschaft, Leistung und Dauer bleiben erhalten</small></span><span>→</span></button><button class="action-row" type="button" data-panel-action="cancel"><span><strong>Termin absagen</strong><small>Folgen und Kommunikation zuerst bestätigen</small></span><span>→</span></button>` : ""}<button class="action-row" type="button" data-customer-from-panel><span><strong>Kundschaft öffnen</strong><small>Historie, Notiz und nächster Termin</small></span><span>→</span></button></div>`;
        panel.innerHTML = panelFrame("Termin", body, `<button class="button" type="button" data-panel-close>Schliessen</button>`);
        bindPanelEvents();
      }

      function panelFrame(title, body, footer) {
        return `<div class="panel-head"><div><div class="eyebrow">Termin im Salonalltag</div><h2 id="panel-title">${title}</h2></div><button class="button icon-button ghost" type="button" data-panel-close aria-label="Panel schliessen">${icons.close}</button></div><div class="panel-body">${body}</div><div class="panel-footer">${footer}</div>`;
      }

      function bindPanelEvents() {
        panel.querySelectorAll("[data-panel-close]").forEach(node => node.addEventListener("click", () => closePanel(true)));
        panel.querySelectorAll("[data-panel-action]").forEach(node => node.addEventListener("click", () => renderPanelView(node.dataset.panelAction)));
        const customerAction = panel.querySelector("[data-customer-from-panel]");
        if (customerAction) customerAction.addEventListener("click", () => { const appointment = selectedAppointment(); const index = customers.findIndex(customer => customer.name === appointment.customer); state.selectedCustomer = Math.max(0, index); closePanel(false); navigate("customers"); });
      }

      function renderPanelView(view) {
        state.panelView = view;
        if (view === "reschedule") renderReschedule();
        if (view === "cancel") renderCancel();
        if (view === "arrival") renderArrival();
        if (view === "visit") renderVisit();
      }

      function renderReschedule() {
        const appointment = selectedAppointment();
        const member = staff.find(person => person.id === appointment.staff);
        const slots = [
          { value: "14:15", label: "Heute, 14:15", staff: member.name, note: "Nächster passender Slot" },
          { value: "09:30", label: "Freitag, 21. August · 09:30", staff: member.name, note: "Gleiche Mitarbeiterin" },
          { value: "11:15", label: "Freitag, 21. August · 11:15", staff: "Sofia", note: "Früher, andere Mitarbeiterin" }
        ];
        state.selectedSlot = null;
        panel.innerHTML = panelFrame("Termin verschieben", `<div class="appointment-hero"><span class="status-chip ${appointment.status}">Bisher</span><h3>${appointment.customer}</h3><p>Heute, ${appointment.start} · ${appointment.service}</p></div><div class="notice"><strong>Was erhalten bleibt</strong><br>Kundschaft, Leistung, Dauer und Salonnotiz werden übernommen. Der alte Termin bleibt bis zum simulierten Erfolg bestehen.</div><div class="eyebrow">Passende freie Zeiten</div><div class="slot-list">${slots.map((slot, index) => `<button type="button" class="slot-button" data-slot="${index}"><span><strong>${slot.label}</strong><small>${slot.staff} · ${slot.note}</small></span><span>Wählen</span></button>`).join("")}</div><div class="form-field"><label for="custom-time">Oder Uhrzeit direkt wählen</label><input id="custom-time" type="time" value="14:15"></div>`, `<button class="button" type="button" data-panel-back>Zurück</button><button class="button primary" type="button" data-reschedule-commit disabled>Verschieben simulieren</button>`);
        panel.querySelectorAll("[data-slot]").forEach(button => button.addEventListener("click", () => { state.selectedSlot = slots[Number(button.dataset.slot)]; panel.querySelectorAll("[data-slot]").forEach(node => node.classList.remove("is-selected")); button.classList.add("is-selected"); panel.querySelector("[data-reschedule-commit]").disabled = false; }));
        panel.querySelector("#custom-time").addEventListener("change", event => { state.selectedSlot = { value: event.target.value, label: `Heute, ${event.target.value}`, staff: member.name, note: "Direkte Uhrwahl" }; panel.querySelector("[data-reschedule-commit]").disabled = false; });
        panel.querySelector("[data-reschedule-commit]").addEventListener("click", commitReschedule);
        panel.querySelector("[data-panel-back]").addEventListener("click", renderAppointmentPanel);
        panel.querySelectorAll("[data-panel-close]").forEach(node => node.addEventListener("click", () => closePanel(true)));
      }

      function commitReschedule() {
        const appointment = selectedAppointment();
        const action = panel.querySelector("[data-reschedule-commit]");
        action.disabled = true;
        action.textContent = "Wird geprüft ...";
        const loading = document.createElement("div"); loading.className = "loading-line"; panel.querySelector(".panel-body").append(loading);
        window.setTimeout(() => {
          appointment.start = state.selectedSlot.value;
          if (state.selectedSlot.staff === "Sofia") appointment.staff = "sofia";
          showSuccess("Termin verschoben", `${appointment.customer} ist neu ${state.selectedSlot.label} bei ${state.selectedSlot.staff} eingeplant. Die SMS-Kommunikation wurde im Prototyp als erfolgreich simuliert.`, "Neuen Termin zeigen");
        }, 650);
      }

      function renderCancel() {
        const appointment = selectedAppointment();
        panel.innerHTML = panelFrame("Termin absagen", `<div class="appointment-hero"><span class="status-chip ${appointment.status}">${statusLabel(appointment.status)}</span><h3>${appointment.customer}</h3><p>Heute, ${appointment.start} · ${appointment.service}</p></div><div class="notice danger"><strong>Dieser Termin wird als abgesagt markiert.</strong><br>${appointment.duration} Minuten werden im Tagesplan wieder frei. Die Kundin bleibt in der Historie sichtbar.</div><div class="eyebrow">Kommunikation</div><div class="choice-list"><label class="choice"><input type="radio" name="cancel-channel" value="SMS" checked><span><strong>SMS vorbereiten</strong><br><small class="muted">Im Prototyp als zugestellt simuliert</small></span></label><label class="choice"><input type="radio" name="cancel-channel" value="Telefonnotiz"><span><strong>Telefonisch informiert</strong><br><small class="muted">Nur als Salonnotiz erfassen</small></span></label></div><label class="choice" style="margin-top:12px"><input id="cancel-confirm" type="checkbox"><span>Ich habe Folgen und Kommunikation geprüft.</span></label>`, `<button class="button" type="button" data-panel-back>Zurück</button><button class="button danger" type="button" data-cancel-commit disabled>Absage simulieren</button>`);
        const checkbox = panel.querySelector("#cancel-confirm");
        const commit = panel.querySelector("[data-cancel-commit]");
        checkbox.addEventListener("change", () => commit.disabled = !checkbox.checked);
        commit.addEventListener("click", () => { const channel = panel.querySelector("input[name='cancel-channel']:checked").value; appointment.status = "cancelled"; showSuccess("Termin abgesagt", `${appointment.customer} ist als abgesagt markiert. ${appointment.duration} Minuten sind wieder frei. Kommunikation: ${channel}.`, "Im Ursprung anzeigen"); });
        panel.querySelector("[data-panel-back]").addEventListener("click", renderAppointmentPanel);
        panel.querySelectorAll("[data-panel-close]").forEach(node => node.addEventListener("click", () => closePanel(true)));
      }

      function renderArrival() {
        const appointment = selectedAppointment();
        panel.innerHTML = panelFrame("Ankunft bestätigen", `<div class="appointment-hero"><span class="status-chip confirmed">Bestätigt</span><h3>${appointment.customer}</h3><p>${appointment.start} · ${appointment.service}</p></div><div class="notice"><strong>Schon erfasst?</strong><br>Auch bei erneutem Tippen wird die Ankunft nur einmal erfasst. Dauert die Aktualisierung länger, bleibt der Zwischenstand sichtbar.</div><div class="facts"><div class="fact"><span>Nächster Zustand</span><strong>Im Salon</strong></div><div class="fact"><span>Erster Schritt</span><strong>Beratung</strong></div></div>`, `<button class="button" type="button" data-panel-back>Zurück</button><button class="button primary" type="button" data-arrival-commit>Ankunft simulieren</button>`);
        panel.querySelector("[data-arrival-commit]").addEventListener("click", () => { appointment.status = "arrived"; appointment.visitStep = 0; showSuccess("Ankunft bestätigt", `${appointment.customer} ist im Salon. Der Besuch wurde geöffnet. Beratung ist der nächste Schritt.`, "Visit öffnen", "visit"); });
        panel.querySelector("[data-panel-back]").addEventListener("click", renderAppointmentPanel);
        panel.querySelectorAll("[data-panel-close]").forEach(node => node.addEventListener("click", () => closePanel(true)));
      }

      function visitNextLabel(appointment) {
        return ["Beratung beginnen", "Waschen abschliessen", "Schnitt beginnen", "Styling und Abschluss"][appointment.visitStep || 0] || "Visit abschliessen";
      }

      function renderVisit() {
        const appointment = selectedAppointment();
        const phases = ["Beratung", "Waschen", "Schnitt", "Styling & Abschluss"];
        const current = appointment.visitStep || 0;
        panel.innerHTML = panelFrame("Visit führen", `<div class="appointment-hero"><span class="status-chip arrived">Im Salon</span><h3>${appointment.customer}</h3><p>${appointment.service} · Planzeiten sind nur Hinweise</p></div><div class="visit-track">${phases.map((phase, index) => `<div class="visit-step ${index < current ? "is-done" : ""} ${index === current ? "is-current" : ""}"><span class="visit-step-number">${index < current ? "✓" : index + 1}</span><span><strong>${phase}</strong><br><small class="muted">${index < current ? "Abgeschlossen" : index === current ? "Jetzt als Nächstes" : "Danach"}</small></span></div>`).join("")}</div>${current === 1 ? `<div class="notice warning"><strong>Waschplatz noch nicht fest zugeteilt</strong><br>Die genaue Platzplanung wird gemeinsam mit dem Salonteam festgelegt.</div>` : ""}`, `<button class="button" type="button" data-panel-back>Zum Termin</button><button class="button primary" type="button" data-visit-next>${current >= phases.length - 1 ? "Visit abschliessen" : `${phases[current]} abschliessen`}</button>`);
        panel.querySelector("[data-visit-next]").addEventListener("click", () => {
          if (current >= phases.length - 1) { appointment.status = "completed"; showSuccess("Visit abgeschlossen", `${appointment.customer} ist abgeschlossen. Der Termin bleibt mit Status und Verlauf im Tageskontext sichtbar.`, "Zum Tagesplan"); }
          else { appointment.visitStep = current + 1; toast("Visit aktualisiert", `${phases[current]} abgeschlossen. Nächster Schritt: ${phases[current + 1]}.`); renderVisit(); }
        });
        panel.querySelector("[data-panel-back]").addEventListener("click", renderAppointmentPanel);
        panel.querySelectorAll("[data-panel-close]").forEach(node => node.addEventListener("click", () => closePanel(true)));
      }

      function showSuccess(title, copy, buttonLabel, nextView = null) {
        panel.innerHTML = panelFrame("Ergebnis", `<div class="success-state"><div><div class="success-mark">✓</div><h3>${title}</h3><p class="muted">${copy}</p><div class="notice"><strong>Du bleibst im gleichen Arbeitsmoment</strong><br>Tag, Suche „${state.search || "kein Suchbegriff"}“ und Ausgangsseite ${screenMeta[state.origin?.screen || state.screen][1]} bleiben für die Rückkehr bestehen.</div></div></div>`, `<button class="button" type="button" data-success-origin>Zum Ausgangspunkt</button><button class="button primary" type="button" data-success-next>${buttonLabel}</button>`);
        panel.querySelector("[data-success-origin]").addEventListener("click", () => returnToOrigin());
        panel.querySelector("[data-success-next]").addEventListener("click", () => { if (nextView === "visit") renderVisit(); else { closePanel(false); state.screen = "day"; el("screen-picker").value = "day"; render(); focusSelectedAppointment(); } });
        panel.querySelectorAll("[data-panel-close]").forEach(node => node.addEventListener("click", () => returnToOrigin()));
      }

      function returnToOrigin() {
        const origin = state.origin;
        closePanel(false);
        if (!origin) return;
        state.screen = origin.screen;
        state.search = origin.search;
        searchInput.value = state.search;
        el("screen-picker").value = state.screen;
        render();
        requestAnimationFrame(()=>{workspaceBody.scrollTop=origin.scrollTop||0;const dayViewport=el("day-viewport");if(dayViewport){dayViewport.scrollLeft=origin.dayScrollLeft||0;dayViewport.scrollTop=origin.dayScrollTop||0;}focusSelectedAppointment();updateDayScrollHints();});
      }

      function focusSelectedAppointment() {
        const target = document.querySelector(`[data-appointment="${state.selectedId}"]`);
        if (target) { target.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" }); target.focus({ preventScroll: true }); target.classList.add("is-selected"); }
      }

      function openPanel() {
        if(state.panelOrigin&&window.innerWidth>760){
          panel.style.setProperty("--panel-from-x",`${state.panelOrigin.x}px`);
          panel.style.setProperty("--panel-from-y",`${state.panelOrigin.y}px`);
          panel.style.setProperty("--panel-origin-x",`${state.panelOrigin.originX}px`);
          panel.style.setProperty("--panel-origin-y",`${state.panelOrigin.originY}px`);
        }else{
          ["--panel-from-x","--panel-from-y","--panel-origin-x","--panel-origin-y"].forEach(name=>panel.style.removeProperty(name));
        }
        backdrop.classList.add("is-open");
        panel.classList.add("is-open");
        document.body.style.overflow = "hidden";
        requestAnimationFrame(() => panel.querySelector("button, input, select")?.focus());
      }

      function closePanel(restoreFocus = true) {
        panel.classList.remove("is-open");
        backdrop.classList.remove("is-open");
        document.body.style.overflow = "hidden";
        if (restoreFocus) focusSelectedAppointment();
      }

      function applySearchState() {
        searchInput.value = state.search;
        const query = state.search.trim().toLocaleLowerCase("de-CH");
        if (!query) { searchResult.classList.remove("is-visible"); return; }
        const match = state.appointments.find(appointment => `${appointment.customer} ${appointment.service}`.toLocaleLowerCase("de-CH").includes(query));
        if (match) {
          searchResult.innerHTML = `<button type="button" data-search-match="${match.id}"><strong>${match.customer}</strong><small>${match.start} · ${match.service} · Im Tagesplan hervorheben</small></button>`;
          searchResult.classList.add("is-visible");
          searchResult.querySelector("button").addEventListener("click", () => revealSearchMatch(match.id));
        } else {
          searchResult.innerHTML = `<button type="button"><strong>Kein direkter Treffer</strong><small>Suchbegriff bleibt erhalten. Versuche einen Namen oder eine Leistung.</small></button>`;
          searchResult.classList.add("is-visible");
        }
      }

      function revealSearchMatch(id) {
        state.selectedId = id;
        state.screen = "day";
        el("screen-picker").value = "day";
        searchResult.classList.remove("is-visible");
        render();
        requestAnimationFrame(() => {
          const target = document.querySelector(`[data-appointment="${id}"]`);
          if (target) { target.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" }); target.focus({ preventScroll: true }); }
        });
      }


      function updateDayScrollHints(){
        const viewport=el("day-viewport"),rangeLabel=el("staff-range");if(!viewport)return;
        const wrap=viewport.closest(".day-viewport-wrap"),leftHint=wrap?.querySelector(".scroll-hint.left"),rightHint=wrap?.querySelector(".scroll-hint.right");
        const hiddenLeft=viewport.scrollLeft>6,hiddenRight=viewport.scrollWidth-viewport.clientWidth-viewport.scrollLeft>6;
        leftHint?.classList.toggle("is-visible",hiddenLeft);rightHint?.classList.toggle("is-visible",hiddenRight);
        const total=visibleStaff().length,columnWidth=total?(viewport.scrollWidth-70)/total:122;
        const first=Math.min(total,Math.max(1,Math.floor(Math.max(0,viewport.scrollLeft-70)/columnWidth)+1));
        const visibleCount=Math.max(1,Math.floor(Math.max(0,viewport.clientWidth-70)/columnWidth)),last=Math.min(total,first+visibleCount-1);
        if(rangeLabel)rangeLabel.textContent=hiddenLeft||hiddenRight?`${first}–${last} von ${total} Mitarbeitenden`:`${total} Mitarbeitende`;
        if(!viewport.dataset.scrollBound){
          viewport.dataset.scrollBound="true";
          viewport.addEventListener("scroll",updateDayScrollHints,{passive:true});
          wrap?.querySelectorAll("[data-scroll-day]").forEach(button=>button.addEventListener("click",()=>viewport.scrollBy({left:Number(button.dataset.scrollDay)*Math.max(244,viewport.clientWidth*.72),behavior:"smooth"})));
        }
      }
      function toast(title, copy) {
        const node = document.createElement("div");
        node.className = "toast";
        node.innerHTML = `<strong>${title}</strong><small>${copy}</small>`;
        el("toast-region").append(node);
        window.setTimeout(() => node.remove(), 3600);
      }

      searchInput.addEventListener("input", event => {
        state.search = event.target.value;
        applySearchState();
        if (state.screen === "day") render();
      });
      searchInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          const query = state.search.trim().toLocaleLowerCase("de-CH");
          const match = state.appointments.find(appointment => `${appointment.customer} ${appointment.service}`.toLocaleLowerCase("de-CH").includes(query));
          if (match) revealSearchMatch(match.id);
        }
        if (event.key === "Escape") { state.search = ""; searchInput.value = ""; searchResult.classList.remove("is-visible"); if (state.screen === "day") render(); }
      });
      document.addEventListener("keydown", event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") { event.preventDefault(); searchInput.focus(); }
        if (event.key === "Escape" && panel.classList.contains("is-open")) closePanel(true);
      });
      backdrop.addEventListener("click", () => closePanel(true));
      el("screen-picker").addEventListener("change", event => navigate(event.target.value));
      el("mode-picker").addEventListener("change", event => { state.mode = event.target.value; state.selectedId = null; closePanel(false); render(); });
      el("theme-toggle").addEventListener("click", event => {
        state.theme = state.theme === "light" ? "dark" : "light";
        document.documentElement.dataset.theme = state.theme;
        event.currentTarget.setAttribute("aria-pressed", state.theme === "dark" ? "true" : "false");
        event.currentTarget.querySelector("span:last-child").textContent = state.theme === "dark" ? "Light" : "Dark";
      });

      render();
    })();
  </script>
</body>
</html>
