function saveDemo(message,undoLabel=''){
 closeModal();demoToast(message,undoLabel);
}
function demoToast(message,undoLabel=''){
 const t=document.getElementById('toast');
 t.innerHTML=undoLabel?`<span class="undo-toast"><span>${escapeHtml(message)}</span><button onclick="demoToast('Änderung rückgängig gemacht.')">${escapeHtml(undoLabel)}</button></span>`:escapeHtml(message);
 t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),3200);return false;
}
function toggleMenu(){const select=document.getElementById('mobileAreaSelect');if(select)select.focus()}
function closeDemoPanel(){document.getElementById('demoPanel').style.display='none'}
function openDemoPanel(){document.getElementById('demoPanel').style.display='block'}
function globalSearch(e){
 if(e.key==='Enter'){openCommandPalette();const q=e.target.value.trim();document.getElementById('commandSearch').value=q;renderCommandResults(q)}
 if(e.key==='Escape')e.target.blur();
}
document.addEventListener('click',e=>{if(!e.target.closest('.profile-menu')&&!e.target.closest('.app-menu-trigger'))closeProfileMenu()})
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommandPalette()}if(e.key==='Escape'){closeDrawer();closeModal();closeCommandPalette()}})
function updateOperatorClock(){const el=document.getElementById('operatorClock');if(el)el.textContent=new Intl.DateTimeFormat('de-CH',{hour:'2-digit',minute:'2-digit'}).format(new Date())}
updateOperatorClock();setInterval(updateOperatorClock,30000);
setInterval(()=>{if(activePage==='calendar'&&calendarState.date===calendarToday()){const line=document.getElementById('caldayNow');if(line){const now=new Date(),m=now.getHours()*60+now.getMinutes();line.style.top=((m-480)*57/30)+'px';line.querySelector('span').textContent='Jetzt '+calendarClock(m)}if(calendarState.followNow)calendarScrollToNow()}},30000);
window.matchMedia('(max-width:780px)').addEventListener?.('change',()=>{if(activePage==='calendar'){calendarState.lastScrollKey='';renderPage()}});
document.addEventListener('pointerdown',e=>{if(activePage==='calendar'&&(calendarState.staffMenu||calendarState.mobileMenu)&&!e.target.closest('.calnav-menu,.calnav-staffwrap,.calday-mobile-focus')){calendarState.staffMenu=false;calendarState.mobileMenu=false;const menu=document.querySelector('.calnav-menu');if(menu)menu.remove()}});

/* V11 – Agenda-Auswahlvertrag als Demonstration.
 * Nicht an den Produktserver angebunden. Die aktuellen Fähigkeiten dürfen
 * später nur aus Visit/AppointmentOperationalRead kommen.
 * Eine Kalenderzelle ist kein Kundenprofil und darf keine Kontaktfelder tragen. */
const agendaDemoHistory = [
 {id:101,name:'Lea Schmid',phone:'+41 78 222 17 89',email:'lea@example.ch',date:'Früher · 16. Juni',time:'09:30',duration:'180 Min.',service:'Balayage',staff:'Elma',status:'Erledigt',note:'Demo-Historie: keine strukturierte Rezeptur hinterlegt.',isDemoHistory:true},
 {id:102,name:'Anna Keller',phone:'+41 79 123 45 67',email:'anna@example.ch',date:'Früher · 18. Juni',time:'10:00',duration:'60 Min.',service:'Waschen, Schneiden, Föhnen',staff:'Belinda',status:'Erledigt',note:'Demo-Historie: keine Behandlungsbeurteilung hinterlegt.',isDemoHistory:true},
 {id:103,name:'Nina Frei',phone:'+41 76 888 12 10',email:'nina@example.ch',date:'Früher · 15. Juni',time:'11:00',duration:'90 Min.',service:'Ansatzfarbe',staff:'Laura',status:'Erledigt',note:'Demo-Historie: Rezeptur nicht verfügbar.',isDemoHistory:true}
];
const agendaDemoDay = new Date('2026-07-20T12:00:00+02:00').getTime();
function agendaDemoAllBookings(){return [...bookings,...agendaDemoHistory]}
function agendaBooking(){return agendaDemoAllBookings().find(b=>b.id===agendaSelectedBookingId)||null}
function agendaCustomerForBooking(b){
 if(!b)return null;
 return customers.find(c=>c.contact && b.phone && c.contact.replace(/\D/g,'')===b.phone.replace(/\D/g,''))||null;
}
function agendaCustomer(){return customers.find(c=>c.id===agendaSelectedCustomerId)||null}
function agendaDemoStart(b){
 const d=b.date==='Heute'?'2026-07-20':b.date==='Morgen'?'2026-07-21':b.date==='Gestern'?'2026-07-19':b.date.includes('Juni')?'2026-06-'+(b.date.match(/\d+/)?.[0]||'15'):'2026-07-20';
 return new Date(d+'T'+b.time+':00+02:00').getTime();
}
function agendaCustomerBookings(c){
 if(!c)return [];
 return agendaDemoAllBookings().filter(b=>b.phone&&c.contact&&b.phone.replace(/\D/g,'')===c.contact.replace(/\D/g,'')).sort((a,b)=>agendaDemoStart(a)-agendaDemoStart(b));
}
function agendaIsActiveAppointment(b){return !!b && b.status==='Bestätigt' && agendaDemoStart(b)>=agendaDemoDay}
function agendaNextBookingForCustomer(c){
 const history=agendaCustomerBookings(c);
 return history.find(b=>agendaIsActiveAppointment(b)) || [...history].reverse().find(b=>agendaDemoStart(b)<agendaDemoDay) || null;
}
function agendaSelectBooking(id){
 const b=agendaDemoAllBookings().find(x=>x.id===Number(id));if(!b)return;
 agendaSelectedBookingId=b.id;
 agendaSelectedCustomerId=agendaCustomerForBooking(b)?.id||null;
 if(agendaStaff.includes(b.staff))agendaMobileStaff=b.staff;
 agendaRefreshWorkspace();
}
function agendaSelectCustomer(id){
 const c=customers.find(x=>x.id===Number(id));if(!c)return;
 agendaSelectedCustomerId=c.id;
 agendaSelectedBookingId=agendaNextBookingForCustomer(c)?.id||null;
 agendaRefreshWorkspace();
}
function agendaSearch(q){
 agendaQuery=q;
 const trimmed=q.trim().toLowerCase();
 if(trimmed.length>=2){
  const matches=customers.filter(c=>`${c.name} ${c.contact} ${c.email||''}`.toLowerCase().includes(trimmed));
  if(matches.length===1){agendaSelectedCustomerId=matches[0].id;agendaSelectedBookingId=agendaNextBookingForCustomer(matches[0])?.id||null;}
 }
 agendaRefreshWorkspace();
}
function agendaNavigateRelated(step){
 const b=agendaBooking(),c=agendaCustomerForBooking(b)||agendaCustomer();
 const history=agendaCustomerBookings(c);
 const i=history.findIndex(x=>x.id===b?.id);
 if(i<0||!history[i+step])return;
 agendaSelectBooking(history[i+step].id);
}
function agendaDemoAction(action){
 const b=agendaBooking();if(!b)return;
 openModal(escapeHtml(action),`<p>${escapeHtml(b.name)} · ${escapeHtml(b.date)} · ${escapeHtml(b.time)} · ${escapeHtml(b.service)}</p>
 <p style="font-size:13px;color:var(--text-2)">Demo: Die Ansicht ist nicht mit den Gasserwerk-Schreibdiensten verbunden. Diese Aktion wird erst angeboten, wenn eine frische serverseitige Freigabe <code>allowed=true</code> liefert. Beim Verschieben müssen die angebotenen Zeitfenster ebenfalls vom Server stammen. Es wurde nichts verändert.</p>
 <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Verstanden</button></div>`);
}
function agendaContext(){
 const b=agendaBooking(),c=agendaCustomerForBooking(b)||agendaCustomer();
 if(!b&&!c)return `<div class="agenda-context-empty"><strong>Keine Auswahl</strong><span>Wähle links einen Termin oder eine Person. Die Agenda lädt dann den Terminkontext. Keine Kundenkontaktdaten im Zeitraster.</span></div>`;
 const history=agendaCustomerBookings(c); const index=history.findIndex(x=>x.id===b?.id);
 const isPast=!!b && (b.isDemoHistory||b.date==='Gestern'||b.status==='Erledigt'||b.status==='Abgesagt');
 const bOptions=history.map(v=>`<option value="${v.id}" ${v.id===b?.id?'selected':''}>${escapeHtml(v.date)} · ${escapeHtml(v.time)} · ${escapeHtml(v.service)}</option>`).join('');
 const effectiveName=c?.name||b?.name||'Kundin';
 const phone=c?.contact||b?.phone||'';
 const validPhone=/^\+?\d[\d +()-]{6,}$/.test(phone);
 const email=c?.email||b?.email||'';
 const validEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
 const mins=parseInt(b?.duration,10);
 const end=b&&Number.isFinite(mins)?(()=>{const [hh,mm]=b.time.split(':').map(Number);const t=hh*60+mm+mins;return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')})():null;
 const shownEnd=end || 'Nicht verfügbar';
 const actionButtons=b&&!isPast?`<button class="action-line" onclick="agendaDemoAction('Termin verschieben')">↗ Verschieben · Demo</button><button class="action-line" onclick="agendaDemoAction('Termin absagen')">× Absagen · Demo</button>`:
 `<p class="agenda-mini-hint">${b?'Vergangener Termin – kein Verschieben oder Absagen.':'Kein Termin ausgewählt.'}</p>`;
 const details=b?`<h3>Termindetails</h3><div class="agenda-detail-name">${escapeHtml(effectiveName)}</div><div class="agenda-detail-status">${escapeHtml(b.status)} · ${escapeHtml(b.date)}</div>
 <dl class="agenda-facts"><dt>Von – bis</dt><dd>${escapeHtml(b.time)} – ${shownEnd}</dd><dt>Service</dt><dd>${escapeHtml(b.service)}</dd><dt>Bei wem</dt><dd>${escapeHtml(b.staff)}</dd><dt>Dauer</dt><dd>${escapeHtml(b.duration)}</dd><dt>Kontakt</dt><dd>${validPhone?`<a href="tel:${phone.replace(/[\s()-]/g,'')}">${escapeHtml(phone)}</a>`:'Nicht verfügbar'}${validEmail?`<br><a href="mailto:${escapeHtml(email)}">${escapeHtml(email)}</a>`:''}</dd><dt>Status</dt><dd>${escapeHtml(b.status)}</dd></dl>
 <div class="agenda-note"><strong>Information zu diesem Termin</strong><p>${escapeHtml(b.note||'Keine Terminnotiz erfasst.')}</p></div>
 <div class="agenda-note"><strong>Frühere Behandlung</strong><p>${isPast?'Dies ist ein historischer Termineintrag.':'Über die Pfeile oder den Terminwähler oben zurückspringen.'} Beurteilung und strukturierte Rezeptur sind noch nicht aus dem Backend angebunden.</p></div>`:
 `<h3>Personenkontext</h3><div class="agenda-detail-name">${escapeHtml(effectiveName)}</div><p class="agenda-mini-hint">Kein bestätigter kommender Termin vorhanden.</p><dl class="agenda-facts"><dt>Kontakt</dt><dd>${validPhone?escapeHtml(phone):'Nicht verfügbar'}</dd><dt>Besuche</dt><dd>${c?.visits??'—'}</dd></dl>`;
 return `<div class="agenda-dual">
  <section class="agenda-block actions" aria-label="Aktionen zum ausgewählten Termin">
   <h3>Aktion</h3>
   ${actionButtons}
   <button class="action-line" onclick="agendaDemoAction('Kontakt aufnehmen')">Kontakt aufnehmen · Demo</button>
   ${c?`<button class="action-line" onclick="openCustomerDrawer(${c.id})">Ganze Karteikarte öffnen</button>`:''}
   <div class="agenda-context-unknown"><strong>Aktionsfreigabe:</strong> in dieser lokalen Demo unbekannt. Die reale App muss <code>actionCapabilities</code>, Versionen und Frische aus dem Visit-Arbeitsraum lesen.</div>
  </section>
  <section class="agenda-block details" aria-label="Details des ausgewählten Termins">${details}</section>
 </div>`;
}
function agendaPerspectiveTabs(){
 return `<nav class="agenda-inside-tabs" aria-label="Agenda – Perspektiven">
 ${[['calendar','Kalender'],['customers','Kundschaft'],['bookings','Termine']].map(([key,label])=>`<button type="button" class="agenda-inside-tab ${activePage===key?'active':''}" ${activePage===key?'aria-current="page"':''} onclick="navigate('${key}')">${label}</button>`).join('')}
 </nav>`;
}
function agendaKartei(){
 const q=agendaQuery.trim().toLowerCase();
 const rows=customers.filter(c=>(!q||`${c.name} ${c.contact} ${c.email||''}`.toLowerCase().includes(q))&&(agendaCustomerFilter==='alle'||agendaCustomerBookings(c).some(b=>agendaIsActiveAppointment(b))));
 return `<div class="agenda-record-list">${rows.length?rows.map(c=>{
 const n=agendaNextBookingForCustomer(c);
 return `<button type="button" class="agenda-customer-choice ${agendaSelectedCustomerId===c.id?'active':''}" onclick="agendaSelectCustomer(${c.id})"><span><strong>${escapeHtml(c.name)}</strong><small>${escapeHtml(c.contact)}</small><small>${n?`${n.status==='Bestätigt'?'Nächster Termin':'Letzter Termin'}: ${escapeHtml(n.date)} · ${escapeHtml(n.time)} · ${escapeHtml(n.service)}`:'Kein Termin vorhanden'}</small></span><span class="agenda-choice-meta">${c.visits} Besuche</span></button>`}).join(''):`<p class="agenda-view-caption">Keine passende Kundin gefunden.</p>`}</div>`;
}
function agendaTermine(){
 let rows=bookings.filter(b=>{
  const q=agendaQuery.trim().toLowerCase();
  if(q&&!`${b.name} ${b.phone} ${b.service} ${b.staff} ${b.date} ${b.time}`.toLowerCase().includes(q))return false;
  if(agendaFilter==='heute'&&b.date!=='Heute')return false;
  if(agendaFilter==='pruefen'&&!b.dataIssue&&b.status!=='Anfrage')return false;
  return true;
 });
 return `<div class="agenda-record-list">${rows.length?rows.map(b=>`<button type="button" class="agenda-choice ${agendaSelectedBookingId===b.id?'active':''}" onclick="agendaSelectBooking(${b.id})"><span class="agenda-choice-time">${escapeHtml(b.time)}</span><span class="agenda-choice-data"><strong>${escapeHtml(b.name)}</strong><small>${escapeHtml(b.service)} · ${escapeHtml(b.date)} · ${escapeHtml(b.duration)}</small></span><span class="agenda-choice-meta">${escapeHtml(b.staff)}</span></button>`).join(''):`<p class="agenda-view-caption">Keine passenden Termine. Passe die Suche oder den Filter an.</p>`}</div>`;
}
function agendaSelectFromRight(value){agendaSelectBooking(Number(value));}
function agendaTermSelector(){
 const b=agendaBooking(),c=agendaCustomerForBooking(b)||agendaCustomer(); const history=agendaCustomerBookings(c),ix=history.findIndex(v=>v.id===b?.id);
 return `<div class="agenda-details-head"><div><h2>Ausgewählter Termin</h2><span class="demo-source">Beispieldaten · kein Live-Zugriff</span></div>
 <div class="agenda-term-nav">
  <button type="button" onclick="agendaNavigateRelated(-1)" ${ix<=0?'disabled':''} aria-label="Vorheriger Termin dieser Person">‹</button>
  <select aria-label="Termin dieser Person auswählen" onchange="agendaSelectFromRight(this.value)" ${history.length?'':'disabled'}>
   ${history.length?history.map(t=>`<option value="${t.id}" ${t.id===b?.id?'selected':''}>${escapeHtml(t.date)} · ${escapeHtml(t.time)} · ${escapeHtml(t.service)}</option>`).join(''):'<option>Keine Termine vorhanden</option>'}
  </select>
  <button type="button" onclick="agendaNavigateRelated(1)" ${ix<0||ix>=history.length-1?'disabled':''} aria-label="Nächster Termin dieser Person">›</button>
 </div></div>`;
}
function agendaRefreshWorkspace(){
 const v=document.getElementById('agendaViewBody');const c=document.getElementById('agendaContextContent');
 if(v){const y=v.scrollTop;v.innerHTML=agendaView();v.scrollTop=y;}
 if(c)c.innerHTML=agendaContext();
 const selector=document.getElementById('agendaV11TermSelector');if(selector)selector.innerHTML=agendaTermSelector();
}
function renderAgenda(){
 setDemoStates([['normal','Beispieldaten']],'Agenda-V11: drei Perspektiven; rechts termingebundene Details und Demo-Aktionen. Keine Live-Daten, keine Schreiboperation.');
 const title=activePage==='calendar'?'Kalenderraster':activePage==='bookings'?'Terminregister':'Kundensuche';
 if(!agendaSelectedBookingId && !agendaSelectedCustomerId){agendaSelectedBookingId=3;agendaSelectedCustomerId=3;}
 return `<section class="agenda-workplace agenda-v9 agenda-v11" aria-label="Agenda – zwei Arbeitsbereiche">
 <div class="agenda-v9-grid">
  <div class="agenda-v9-left-head">${agendaPerspectiveTabs()}<div class="agenda-filter-wrap">${agendaSideTools()}</div></div>
  <section class="agenda-work-area agenda-v9-main" aria-labelledby="agendaLeftTitle"><h2 id="agendaLeftTitle" class="visually-hidden">${title}</h2><div class="agenda-body" id="agendaViewBody" tabindex="0" aria-label="${title} – scrollbarer Inhalt">${agendaView()}</div></section>
  <aside class="agenda-work-area is-context agenda-v9-context" aria-label="Ausgewählter Termin und Aktionen">
   <div id="agendaV11TermSelector">${agendaTermSelector()}</div>
   <div class="agenda-context-content" id="agendaContextContent" tabindex="0" aria-label="Termindetails und Handlungen">${agendaContext()}</div>
  </aside>
 </div><p class="agenda-page-foot">Kalender · Kundschaft · Termine wählen denselben Terminkontext. Der Terminwähler rechts springt innerhalb der Besuchshistorie. Alle Personen- und Termindaten sind ausdrücklich erfundene Testdaten.</p></section>`;
}

renderNavigation();renderPage();
</script>
