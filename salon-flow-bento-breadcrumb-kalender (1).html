 openDrawer('Kanonisches Statusmodell','Vier getrennte Achsen verhindern, dass „aktiv“, „sichtbar“ und „buchbar“ dasselbe meinen.',`<div class="status-model"><div class="status-axis"><strong>Datensatz</strong><div>${STATUS_MODEL.record.map(x=>badge(x,x==='Aktiv'?'success':'' )).join('')}</div></div><div class="status-axis"><strong>Öffentliche Sichtbarkeit</strong><div>${STATUS_MODEL.visibility.map(x=>badge(x,x==='Sichtbar'?'info':'' )).join('')}</div></div><div class="status-axis"><strong>Buchbarkeit</strong><div>${STATUS_MODEL.bookability.map(x=>badge(x,x==='Buchbar'?'success':x==='Unvollständig'?'warning':'' )).join('')}</div></div><div class="status-axis"><strong>Termin</strong><div>${STATUS_MODEL.appointment.map(x=>badge(x,x==='Anfrage'?'warning':x==='Bestätigt'?'success':x==='No-Show'?'danger':'' )).join('')}</div></div></div>`,`<button class="btn btn-secondary" onclick="closeDrawer()">Schliessen</button>`);
}
function commandEntries(query=''){
 const q=query.trim().toLowerCase();
 const data=[
  ...COMMANDS,
  ...customers.map(c=>({group:'Kunden',icon:'○',title:c.name,sub:`${c.contact} · ${c.status}`,run:()=>openCustomerDrawer(c.id)})),
  ...bookings.map(b=>({group:'Termine',icon:'▤',title:`${b.name} · ${b.date} ${b.time}`,sub:`${b.service} · ${b.status}`,run:()=>openBookingDrawer(b.id)})),
  ...staff.map(s=>({group:'Team',icon:'♙',title:s.name,sub:`${s.role} · ${s.status}`,run:()=>openStaffDrawer(s.id)})),
  ...services.map(s=>({group:'Leistungen',icon:'◇',title:s.name,sub:`${s.duration} · ${s.price}`,run:()=>navigate('offer')})),
  ...locations.map(l=>({group:'Standorte',icon:'⌖',title:l.name,sub:l.address,run:()=>navigate('locations')}))
 ];
 return q?data.filter(x=>(x.title+' '+x.sub+' '+x.group).toLowerCase().includes(q)):data.slice(0,14);
}
function openCommandPalette(){
 document.getElementById('commandWrap').classList.add('open');const input=document.getElementById('commandSearch');input.value='';commandIndex=0;renderCommandResults('');setTimeout(()=>input.focus(),0);
}
function closeCommandPalette(){document.getElementById('commandWrap').classList.remove('open')}
function commandBackdropClose(e){if(e.target.id==='commandWrap')closeCommandPalette()}
function renderCommandResults(q){
 const entries=commandEntries(q);window.__commandEntries=entries;commandIndex=Math.min(commandIndex,Math.max(entries.length-1,0));
 let group='';
 document.getElementById('commandResults').innerHTML=entries.length?entries.map((x,i)=>`${x.group!==group?(group=x.group,`<div class="command-group">${x.group}</div>`):''}<button class="command-item ${i===commandIndex?'active':''}" onclick="runCommand(${i})"><span class="command-item-icon">${x.icon}</span><span class="command-item-copy"><strong>${escapeHtml(x.title)}</strong><span>${escapeHtml(x.sub)}</span></span><span class="arrow">↵</span></button>`).join(''):`<div class="empty" style="padding:28px"><strong>Kein Ergebnis</strong><p>Suche nach Kunde, Termin, Team, Leistung, Standort oder Aktion.</p></div>`;
}
function commandKeydown(e){
 const entries=window.__commandEntries||[];
 if(e.key==='ArrowDown'){e.preventDefault();commandIndex=Math.min(commandIndex+1,entries.length-1);renderCommandResults(e.target.value)}
 if(e.key==='ArrowUp'){e.preventDefault();commandIndex=Math.max(commandIndex-1,0);renderCommandResults(e.target.value)}
 if(e.key==='Enter'&&entries.length){e.preventDefault();runCommand(commandIndex)}
 if(e.key==='Escape')closeCommandPalette();
}
function runCommand(i){const item=(window.__commandEntries||[])[i];if(item){closeCommandPalette();item.run()}}
function toggleProfileMenu(e){e.stopPropagation();document.getElementById('profileMenu').classList.toggle('open')}
function closeProfileMenu(){document.getElementById('profileMenu').classList.remove('open')}

function openDrawer(title,subtitle,body,footer=''){
 document.getElementById('drawer').innerHTML=`<div class="drawer-head"><div><h3>${title}</h3><p>${subtitle}</p></div><button class="drawer-close" onclick="closeDrawer()">×</button></div><div class="drawer-body">${body}</div><div class="drawer-footer">${footer||`<button class="btn btn-secondary" onclick="closeDrawer()">Schliessen</button>`}</div>`;
 document.getElementById('drawerBackdrop').classList.add('open');
}
function closeDrawer(){document.getElementById('drawerBackdrop').classList.remove('open')}
function drawerBackdropClose(e){if(e.target.id==='drawerBackdrop')closeDrawer()}
function openBookingDrawer(id){
 const b=bookings.find(x=>x.id===id)||bookings[0];
 const isPast=b.phase==='past';
 const isRequest=b.status==='Anfrage';
 const contactOk=!b.dataIssue;
 let footer='';
 if(isPast&&b.status!=='Erledigt'&&b.status!=='No-Show'&&b.status!=='Abgesagt'){
  footer=`<button class="btn btn-secondary" onclick="demoToast('Termin als erledigt markiert.','Rückgängig')">Erledigt</button><button class="btn btn-danger" onclick="demoToast('Termin als No-Show markiert.','Rückgängig')">No-Show</button>`;
 }else if(isRequest){
  footer=`<button class="btn btn-primary" onclick="demoToast('Anfrage bestätigt.','Rückgängig')">Bestätigen</button><button class="btn btn-secondary" onclick="demoToast('Terminverschiebung geöffnet')">Verschieben</button><button class="btn btn-danger" onclick="demoToast('Anfrage abgesagt.','Rückgängig')">Absagen</button>`;
 }else if(!isPast){
  footer=`<button class="btn btn-secondary" onclick="demoToast('Termin bearbeiten')">Bearbeiten</button><button class="btn btn-secondary" onclick="demoToast('Terminverschiebung geöffnet')">Verschieben</button><button class="btn btn-danger" onclick="demoToast('Absage vorbereitet')">Absagen</button>`;
 }else{
  footer=`<button class="btn btn-secondary" onclick="closeDrawer()">Schliessen</button>`;
 }
 openDrawer(b.name,`${b.date} · ${b.time} · ${b.status}`,`${b.dataIssue?`<div class="callout warning" style="margin-bottom:14px"><div><strong>Datenqualität prüfen</strong><p>Name, Telefonnummer oder E-Mail sind unvollständig. Der Termin bleibt nutzbar, aber die Korrektur wird empfohlen.</p></div></div>`:''}<div class="detail-grid"><div class="detail-box"><span>Leistung</span><strong>${b.service}</strong></div><div class="detail-box"><span>Dauer</span><strong>${b.duration}</strong></div><div class="detail-box"><span>Mitarbeitende</span><strong>${b.staff}</strong></div><div class="detail-box"><span>Terminstatus</span><strong>${b.status}</strong></div></div><div class="card card-padded" style="margin-top:14px;box-shadow:none"><h3 class="card-title">Kontakt aufnehmen</h3><p class="card-subtitle"><a href="${contactOk?'tel:'+b.phone.replace(/\s/g,''):'#'}">${b.phone}</a><br><a href="${contactOk?'mailto:'+b.email:'#'}">${b.email}</a></p><div style="display:flex;gap:8px;margin-top:12px"><a class="btn btn-secondary btn-sm" href="${contactOk?'tel:'+b.phone.replace(/\s/g,''):'#'}">Anrufen</a><a class="btn btn-secondary btn-sm" href="${contactOk?'mailto:'+b.email:'#'}">E-Mail</a><button class="btn btn-secondary btn-sm" onclick="demoToast('Nachricht vorbereitet')">Nachricht</button></div></div><div class="card card-padded" style="margin-top:14px;box-shadow:none"><h3 class="card-title">Notiz</h3><p class="card-subtitle">${b.note||'Keine Notiz vorhanden.'}</p><button class="btn btn-ghost btn-sm" style="margin-top:9px" onclick="demoToast('Notiz bearbeiten')">Notiz bearbeiten</button></div>`,footer);
}
function openCustomerDrawer(id){
 const c=customers.find(x=>x.id===id)||customers[0];
 openDrawer(c.name,`${c.visits} Besuche · zuletzt ${c.last}`,`${c.dataIssue?`<div class="callout warning" style="margin-bottom:14px"><div><strong>Plausibilitätsprüfung</strong><p>Name oder Kontaktangaben wirken unvollständig. Nicht blockiert, aber sichtbar zur Korrektur markiert.</p></div></div>`:''}<div class="detail-grid"><div class="detail-box"><span>Telefon</span><strong><a href="${c.dataIssue?'#':'tel:'+c.contact.replace(/\s/g,'')}">${c.contact}</a></strong></div><div class="detail-box"><span>E-Mail</span><strong><a href="${c.dataIssue?'#':'mailto:'+c.email}">${c.email}</a></strong></div><div class="detail-box"><span>Kundenwert</span><strong>${c.value}</strong></div><div class="detail-box"><span>Datenstatus</span><strong>${c.status}</strong></div></div><div class="card card-padded" style="margin-top:14px;box-shadow:none"><h3 class="card-title">Letzte Termine</h3>${bookings.slice(0,3).map(b=>`<div class="agenda-item"><div class="agenda-time">${b.date}</div><div class="agenda-copy"><strong>${b.service}</strong><span>${b.staff} · ${b.price}</span></div></div>`).join('')}</div>`,`<button class="btn btn-secondary" onclick="demoToast('Kunde bearbeiten')">Bearbeiten</button><button class="btn btn-primary" onclick="openModal('Neue Buchung',bookingForm())">Buchung erstellen</button>`);
}
function openStaffDrawer(id){
 const s=staff.find(x=>x.id===id)||staff[0];
 openDrawer(s.name,s.role,`<div class="detail-grid"><div class="detail-box"><span>Standorte</span><strong>${s.locations}</strong></div><div class="detail-box"><span>Buchbarkeit</span><strong>${s.status}</strong></div></div><div class="card card-padded" style="margin-top:14px;box-shadow:none"><h3 class="card-title">Leistungen</h3><p class="card-subtitle">${s.services}</p></div><div class="card card-padded" style="margin-top:14px;box-shadow:none"><h3 class="card-title">Nächste Arbeitszeit</h3><p class="card-subtitle">Montag, 08:30–17:30 · Grenchen</p></div>`,`<button class="btn btn-secondary" onclick="demoToast('Leistungen zuordnen')">Leistungen zuordnen</button><button class="btn btn-primary" onclick="demoToast('Profil bearbeiten')">Bearbeiten</button>`);
}
function openModal(title,body){
 document.getElementById('modal').innerHTML=`<div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">×</button></div>${body}`;
 document.getElementById('modalWrap').classList.add('open');
}
function closeModal(){document.getElementById('modalWrap').classList.remove('open')}
function modalBackdropClose(e){if(e.target.id==='modalWrap')closeModal()}
function formActions(label='Speichern'){return `<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button><button class="btn btn-primary" onclick="saveDemo('${label} wurde in der Demo ausgeführt.')">${label}</button></div>`}
function bookingForm(){return `<div class="field"><label>Kundin oder Kunde</label><input value="Mia Baumann"></div><div class="field"><label>Leistung</label><select><option>Waschen, Schneiden, Föhnen · 60 Min.</option><option>Balayage · 180 Min.</option></select></div><div class="field"><label>Mitarbeitende</label><select><option>Belinda</option><option>Elma</option><option>Laura</option></select></div><div class="field"><label>Datum und Zeit</label><input value="21.07.2026 · 09:30"></div>${formActions('Buchung anlegen')}`}
function blockForm(){return `<div class="field"><label>Mitarbeitende</label><select><option>Belinda</option><option>Elma</option><option>Laura</option></select></div><div class="field"><label>Grund</label><select><option>Pause</option><option>Schulung</option><option>Interner Termin</option><option>Sonstiges</option></select></div><div class="field"><label>Zeitraum</label><input value="13:00–13:30"></div>${formActions('Zeit reservieren')}`}
function customerForm(){return `<div class="field"><label>Name</label><input value="Mia Baumann" minlength="2"><small style="color:var(--text-3)">Kurze oder unvollständige Namen werden zur Prüfung markiert, nicht aggressiv blockiert.</small></div><div class="field"><label>Telefon</label><input value="+41 79 000 00 00"></div><div class="field"><label>E-Mail</label><input value="mia@example.ch"></div>${formActions('Kunde speichern')}`}
function serviceForm(){return `<div class="field"><label>Name der Leistung</label><input value="Glossing"></div><div class="field"><label>Kategorie</label><select><option>Coloration</option><option>Damen</option><option>Herren</option></select></div><div class="grid-2"><div class="field"><label>Dauer</label><input value="60 Min."><small style="color:var(--warning)">Vorschlag aus Kategorie, Teilleistungen und Salonkontext — bitte prüfen.</small></div><div class="field"><label>Preis</label><input value="CHF 95"></div></div>${formActions('Leistung speichern')}`}
function staffForm(){return `<div class="field"><label>Name</label><input value="Mia Baumann"></div><div class="field"><label>Rolle</label><input value="Stylistin"></div><div class="field"><label>Standort</label><select><option>Grenchen</option><option>Solothurn</option></select></div>${formActions('Mitarbeitende speichern')}`}
function locationForm(){return `<div class="field"><label>Name</label><input value="Biel"></div><div class="field"><label>Adresse</label><input value="Bahnhofstrasse 10, 2502 Biel"></div>${formActions('Standort speichern')}`}
function availabilityForm(){return `<div class="field"><label>Mitarbeitende</label><select><option>Belinda</option><option>Elma</option></select></div><div class="field"><label>Wochentag</label><select><option>Montag</option><option>Dienstag</option></select></div><div class="field"><label>Arbeitszeit</label><input value="08:30–17:30"></div>${formActions('Arbeitszeit speichern')}`}
function absenceForm(){return `<div class="field"><label>Art</label><select><option>Ferien</option><option>Schulung</option><option>Krankheit</option></select></div><div class="field"><label>Zeitraum</label><input value="24.07.2026–31.07.2026"></div>${formActions('Abweichung speichern')}`}
function scanForm(){return `<div class="field"><label>Website-Adresse</label><input value="https://salon-lumiere.ch"></div><div class="callout info"><div><strong>Ehrlicher, wiederaufnehmbarer Prozess</strong><p>Phasen statt künstlichem Prozentwert. Ein zweiter Scan wird verhindert, solange die Prüfung läuft.</p></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button><button class="btn btn-primary" onclick="closeModal();startDemoScan()">Prüfung starten</button></div>`}
function websiteForm(){return `<div class="field"><label>Website-Adresse</label><input value="https://salon-lumiere.ch"></div>${formActions('Website verbinden')}`}
function saveDemo(message,undoLabel=''){
 closeModal();demoToast(message,undoLabel);
}
function demoToast(message,undoLabel=''){
 const t=document.getElementById('toast');
 t.innerHTML=undoLabel?`<span class="undo-toast"><span>${escapeHtml(message)}</span><button onclick="demoToast('Änderung rückgängig gemacht.')">${escapeHtml(undoLabel)}</button></span>`:escapeHtml(message);
 t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),3200);return false;
}
function toggleMenu(){const select=document.getElementById('mobileAreaSelect');if(select)select.focus()}
function closeDemoPanel(){document.getElementById('demoPanel').style.display='none'}
function openDemoPanel(){document.getElementById('demoPanel').style.display='block'}
function globalSearch(e){
 if(e.key==='Enter'){openCommandPalette();const q=e.target.value.trim();document.getElementById('commandSearch').value=q;renderCommandResults(q)}
 if(e.key==='Escape')e.target.blur();
}
document.addEventListener('click',e=>{if(!e.target.closest('.profile-menu')&&!e.target.closest('.avatar')&&!e.target.closest('.mobile-avatar'))closeProfileMenu()})
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommandPalette()}if(e.key==='Escape'){closeDrawer();closeModal();closeCommandPalette()}})
function updateOperatorClock(){const el=document.getElementById('operatorClock');if(el)el.textContent=new Intl.DateTimeFormat('de-CH',{hour:'2-digit',minute:'2-digit'}).format(new Date())}
updateOperatorClock();setInterval(updateOperatorClock,30000);
setInterval(()=>{if(activePage==='calendar'&&calendarState.date===calendarToday()){const line=document.getElementById('caldayNow');if(line){const now=new Date(),m=now.getHours()*60+now.getMinutes();line.style.top=((m-480)*57/30)+'px';line.querySelector('span').textContent='Jetzt '+calendarClock(m)}if(calendarState.followNow)calendarScrollToNow()}},30000);
window.matchMedia('(max-width:780px)').addEventListener?.('change',()=>{if(activePage==='calendar'){calendarState.lastScrollKey='';renderPage()}});
document.addEventListener('pointerdown',e=>{if(activePage==='calendar'&&(calendarState.staffMenu||calendarState.mobileMenu)&&!e.target.closest('.calnav-menu,.calnav-staffwrap,.calday-mobile-focus')){calendarState.staffMenu=false;calendarState.mobileMenu=false;const menu=document.querySelector('.calnav-menu');if(menu)menu.remove()}});
renderNavigation();renderPage();
</script>
