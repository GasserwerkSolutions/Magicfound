<!doctype html>
<html lang="de" data-mode="light" data-tone="studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gasserwerk Dashboard – vollständige lokale Demo</title>
<style>
:root{
  --bg:#f4f3ef;--bg-2:#efeee9;--surface:#fff;--surface-subtle:#f8f8f5;--surface-hover:#f2f2ed;
  --text:#20231f;--text-2:#555e55;--text-3:#687168;--border:#dfe3dc;--border-light:#e8ebe5;--border-dark:#c9d0c6;
  --brand:#955f18;--brand-dark:#6d430e;--brand-light:#f5ead7;--brand-soft:#fbf6ed;
  --daily:#425f55;--daily-bg:#edf3f0;--online:#60768d;--online-bg:#eff3f7;--ops:#7a664c;--ops-bg:#f5f1e9;
  --warning:#8a5a00;--warning-bg:#fff8e6;--warning-border:#d99a1a;
  --danger:#9f1d1d;--danger-bg:#fff1f1;--danger-border:#dc2626;
  --success:#17663c;--success-bg:#edf8f1;--success-border:#54a478;
  --info:#1e4f73;--info-bg:#eef6fb;--info-border:#8eb7d0;
  --shadow:0 8px 26px rgba(35,40,35,.055);--shadow-lg:0 24px 80px rgba(20,28,22,.22);
  --radius:14px;--radius-sm:10px;--sidebar:246px;
}
*{box-sizing:border-box}
html{color-scheme:light;scroll-behavior:smooth}
body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit}button,a{-webkit-tap-highlight-color:transparent}
a{color:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#202923;color:#f6f6f1;padding:18px 13px;border-right:1px solid rgba(255,255,255,.07);z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:5px 8px 21px;font-weight:780;letter-spacing:-.02em}
.brand-mark{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:#f1dfbd;color:#3d2a10;font-weight:900}
.nav-group{margin:12px 0 18px}
.nav-label{padding:0 10px 7px;color:#9cac9f;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;min-height:41px;margin:2px 0;padding:9px 10px;border:0;width:100%;border-radius:10px;background:transparent;color:#dbe2dc;text-decoration:none;font-size:13px;font-weight:620;cursor:pointer;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.06)}
.nav-item.active{background:#f1dfbd;color:#322413}
.nav-icon{width:18px;text-align:center;opacity:.92}
.nav-meta{margin-left:auto;min-width:19px;padding:1px 5px;border-radius:999px;background:rgba(255,255,255,.09);font-size:10px;text-align:center}
.nav-item.active .nav-meta{background:rgba(50,36,19,.09)}
#navigation{flex:1;min-height:0}
.sidebar-footer{margin-top:auto;padding:13px 10px;border-top:1px solid rgba(255,255,255,.1);color:#aebbb1;font-size:11px}
.mobile-topbar{display:none}
.main{min-width:0}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.88);backdrop-filter:blur(14px);position:sticky;top:0;z-index:30}
.crumb{color:var(--text-3);font-size:13px}
.top-actions{display:flex;align-items:center;gap:10px}
.search-wrap{position:relative}
.search{width:250px;padding:9px 34px 9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-subtle);color:var(--text-2)}
.search-key{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-3);border:1px solid var(--border);border-radius:5px;padding:1px 4px;background:white}
.avatar{width:34px;height:34px;border:0;border-radius:50%;display:grid;place-items:center;background:#ded9cc;color:#4a4437;font-size:12px;font-weight:800;cursor:pointer}
.content{max-width:1500px;margin:0 auto;padding:32px 34px 72px}
.page-head{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;margin-bottom:23px}
.page-head-copy{min-width:0}
h1{margin:0;font-size:clamp(25px,3vw,34px);letter-spacing:-.035em;line-height:1.15}
.subhead{margin:8px 0 0;color:var(--text-3);font-size:14px;max-width:760px}
.head-actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:flex-end}
.btn{min-height:41px;border-radius:10px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;font-weight:720;font-size:13px;cursor:pointer;text-decoration:none;transition:transform .15s ease,background .15s ease,border-color .15s ease}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:white;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 5px rgba(74,42,8,.18)}
.btn-primary:hover{background:var(--brand-dark)}
.btn-secondary{color:var(--text-2);background:var(--surface);border-color:var(--border)}
.btn-secondary:hover{background:var(--surface-hover);border-color:var(--border-dark)}
.btn-ghost{color:var(--text-2);background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-hover)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:#e7b3b3}
.btn-sm{min-height:35px;padding:7px 10px;font-size:12px}
.icon-btn{width:39px;padding:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-padded{padding:19px}
.card-title{margin:0;font-size:15px;letter-spacing:-.01em}
.card-subtitle{margin:5px 0 0;color:var(--text-3);font-size:12px}
.section-head{padding:18px 19px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--border-light)}
.section-head h2{margin:0;font-size:16px;letter-spacing:-.015em}
.section-head p{margin:5px 0 0;color:var(--text-3);font-size:12px}
.section-actions{display:flex;flex-wrap:wrap;gap:8px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--border-light);background:var(--surface-subtle)}
.toolbar-group{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.toolbar-spacer{flex:1}
.input,.select,.textarea{border:1px solid var(--border);border-radius:9px;background:white;color:var(--text);padding:9px 10px;min-height:39px}
.input:focus,.select:focus,.textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 32%,transparent);border-color:var(--brand)}
.input-search{min-width:230px}
.chip{min-height:34px;border:1px solid var(--border);border-radius:999px;background:white;color:var(--text-2);padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--surface-hover)}
.chip.active{background:var(--brand-light);color:var(--brand-dark);border-color:#dfc28a}
.chip.attention.active{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border)}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--surface-subtle);color:var(--text-2);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;white-space:nowrap}
.badge.warning{border-color:var(--warning-border);background:var(--warning-bg);color:var(--warning)}
.badge.danger{border-color:var(--danger-border);background:var(--danger-bg);color:var(--danger)}
.badge.success{border-color:var(--success-border);background:var(--success-bg);color:var(--success)}
.badge.info{border-color:var(--info-border);background:var(--info-bg);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:0 0 auto}
.dot.daily{background:var(--daily)}.dot.online{background:var(--online)}.dot.warn{background:var(--warning-border)}.dot.danger{background:var(--danger-border)}.dot.success{background:var(--success-border)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 19px 17px;min-width:0}
.stat.warning{border-color:#ead7a8;background:linear-gradient(180deg,#fff 0%,#fffdf7 100%)}
.stat-label{color:var(--text-3);font-size:10px;font-weight:820;text-transform:uppercase;letter-spacing:.08em}
.stat-value{margin-top:9px;font-variant-numeric:tabular-nums;font-size:28px;font-weight:770;letter-spacing:-.035em}
.stat-detail{margin-top:4px;color:var(--text-2);font-size:12px}
.stat.warning .stat-detail{color:var(--warning)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.golden{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.stack{display:grid;gap:15px}
.area-card{background:white;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;text-decoration:none;color:inherit;transition:transform .16s ease}
.area-card:hover{transform:translateY(-2px)}
.area-card.online{border-left:5px solid var(--online)}
.area-card.daily{border-left:5px solid var(--daily)}
.area-card.ops{border-left:5px solid var(--ops)}
.area-head{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;font-size:10px;font-weight:840;letter-spacing:.08em;text-transform:uppercase}
.online .area-head{background:var(--online-bg);color:#42576b}.daily .area-head{background:var(--daily-bg);color:#345047}.ops .area-head{background:var(--ops-bg);color:#654f35}
.area-body{display:flex;gap:13px;align-items:center;padding:17px 16px}
.area-copy{min-width:0;flex:1}.area-copy strong{display:block;font-size:14px}.area-copy span{display:block;color:var(--text-2);font-size:12px;margin-top:4px}
.attention{width:41px;height:41px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;background:var(--warning-bg);color:var(--warning);font-weight:900}
.arrow{color:var(--text-2);font-size:12px;font-weight:760;white-space:nowrap}
.callouts{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.callout{border-radius:12px;border:1px solid;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;gap:15px;text-decoration:none}
.callout.info{background:var(--info-bg);color:var(--info);border-color:var(--info-border)}
.callout.warning{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border)}
.callout.danger{background:var(--danger-bg);color:var(--danger);border-color:#ebb0b0}
.callout.success{background:var(--success-bg);color:var(--success);border-color:var(--success-border)}
.callout strong{font-size:13px;display:block}.callout p{margin:4px 0 0;font-size:12px;opacity:.86}.callout .cta{font-size:12px;font-weight:800;white-space:nowrap}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse;min-width:760px}
.table th{padding:10px 14px;text-align:left;color:var(--text-3);font-size:10px;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border-light);background:var(--surface-subtle);white-space:nowrap}
.table td{padding:13px 14px;border-bottom:1px solid var(--border-light);font-size:12px;vertical-align:middle}
.table tr:last-child td{border-bottom:0}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:var(--surface-hover)}
.primary-cell strong{display:block;font-size:13px}.primary-cell span{display:block;color:var(--text-3);font-size:11px;margin-top:2px}
.row-actions{display:flex;justify-content:flex-end;gap:6px}
.empty{padding:48px 24px;text-align:center;color:var(--text-2)}
.empty-icon{width:57px;height:57px;border-radius:18px;display:grid;place-items:center;margin:0 auto 14px;background:var(--surface-subtle);border:1px solid var(--border);font-size:24px}
.empty strong{display:block;color:var(--text);font-size:15px}.empty p{max-width:480px;margin:7px auto 16px;font-size:13px;color:var(--text-3)}
.list-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border-light);cursor:pointer}
.list-row:last-child{border-bottom:0}.list-row:hover{background:var(--surface-hover)}
.list-time{font-size:13px;font-weight:770;color:var(--text-2);display:flex;align-items:center;gap:7px}
.list-main{min-width:0}.list-main strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-main span{display:block;color:var(--text-3);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-tags{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--border-light);color:var(--text-3);font-size:11px}
.calendar-shell{display:grid;grid-template-columns:72px repeat(5,minmax(150px,1fr));min-width:920px}
.calendar-corner,.calendar-day-head{position:sticky;top:0;z-index:3;background:var(--surface-subtle);border-bottom:1px solid var(--border);padding:11px;text-align:center}
.calendar-corner{left:0;z-index:4}.calendar-day-head strong{font-size:12px;display:block}.calendar-day-head span{font-size:10px;color:var(--text-3)}
.calendar-time{position:sticky;left:0;z-index:2;background:white;border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light);padding:10px 8px;color:var(--text-3);font-size:10px;text-align:right;height:76px}
.calendar-cell{position:relative;height:76px;border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light);padding:5px}
.cal-event{height:100%;border-radius:8px;padding:7px 8px;font-size:10px;overflow:hidden;border-left:4px solid var(--daily);background:#eef5f2;color:#29463c;cursor:pointer}
.cal-event strong{display:block;font-size:11px}.cal-event span{display:block;margin-top:2px;opacity:.8}
.cal-event.open{background:#fff7e8;color:#704b09;border-left-color:var(--warning-border);border:1px dashed var(--warning-border);border-left-width:4px}
.cal-event.block{background:#f1f1ef;color:#60655f;border-left-color:#8b918a;background-image:repeating-linear-gradient(-45deg,transparent,transparent 5px,rgba(100,105,100,.07) 5px,rgba(100,105,100,.07) 10px)}
.mobile-agenda{display:none}
.agenda-day{margin-bottom:15px}.agenda-day h3{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin:0 0 7px}
.agenda-item{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-light)}
.agenda-item:last-child{border-bottom:0}.agenda-time{font-weight:770;font-size:12px}.agenda-copy strong{font-size:13px;display:block}.agenda-copy span{font-size:11px;color:var(--text-3);display:block;margin-top:2px}
.profile-card{display:flex;gap:13px;align-items:flex-start;padding:17px}
.profile-avatar{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--brand-light);color:var(--brand-dark);font-weight:850;flex:0 0 auto}
.profile-main{min-width:0;flex:1}.profile-main h3{margin:0;font-size:14px}.profile-main p{margin:3px 0;color:var(--text-3);font-size:11px}.profile-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.progress{height:8px;border-radius:999px;background:var(--bg-2);overflow:hidden}.progress>span{display:block;height:100%;border-radius:inherit;background:var(--brand)}
.check-list{display:grid;gap:9px}.check-row{display:flex;align-items:flex-start;gap:9px;font-size:12px}.check-icon{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);font-size:10px;flex:0 0 auto}.check-icon.open{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border)}
.service-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px auto;gap:10px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--border-light)}
.service-row:last-child{border-bottom:0}.service-row strong{font-size:13px}.service-row span{font-size:11px;color:var(--text-3)}
.schedule-grid{display:grid;grid-template-columns:150px repeat(5,minmax(120px,1fr));min-width:800px}
.schedule-head,.schedule-staff,.schedule-cell{padding:11px;border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light)}
.schedule-head{background:var(--surface-subtle);font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.schedule-staff{font-size:12px;font-weight:740;background:white}
.schedule-cell{font-size:11px;color:var(--text-2);background:white}
.time-block{display:inline-block;border:1px solid var(--border);border-radius:7px;padding:4px 6px;background:var(--surface-subtle)}
.preview-shell{background:#eceae3;border-radius:16px;padding:18px}
.browser{background:white;border:1px solid #d7d9d3;border-radius:13px;overflow:hidden;box-shadow:0 12px 40px rgba(30,35,30,.12)}
.browser-bar{height:34px;background:#f2f2ef;border-bottom:1px solid #dedfd9;display:flex;align-items:center;gap:5px;padding:0 10px}.browser-dot{width:8px;height:8px;border-radius:50%;background:#d2d2cd}.browser-url{margin-left:8px;flex:1;height:19px;border-radius:6px;background:white;border:1px solid #dddeda;color:var(--text-3);font-size:10px;padding:3px 8px}
.site-preview{padding:30px;min-height:320px;background:linear-gradient(135deg,#f5efe6,#fbfaf7)}.site-preview h3{font-family:Georgia,serif;font-size:28px;margin:0 0 8px;color:#3b3023}.site-preview p{max-width:430px;color:#776958;font-size:12px}.site-cta{display:inline-block;margin-top:13px;border:0;border-radius:999px;background:#7b4d20;color:white;padding:10px 15px;font-weight:760;font-size:11px}
.widget-preview{max-width:380px;margin:0 auto;background:white;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.widget-head{padding:20px;background:#27332b;color:white}.widget-head h3{margin:0}.widget-body{padding:18px}.widget-step{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border-light)}.widget-step:last-child{border-bottom:0}.widget-step-num{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--brand-light);color:var(--brand-dark);font-size:10px;font-weight:850}
.bar-chart{height:230px;display:flex;align-items:flex-end;gap:12px;padding:20px 8px 0;border-bottom:1px solid var(--border)}.bar{flex:1;min-width:24px;background:linear-gradient(180deg,var(--brand),var(--brand-dark));border-radius:8px 8px 2px 2px;position:relative}.bar span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-3)}.bar em{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9px;color:var(--text-2)}
.settings-list{display:grid}.settings-row{display:flex;align-items:center;gap:13px;padding:15px 17px;border-bottom:1px solid var(--border-light);cursor:pointer}.settings-row:last-child{border-bottom:0}.settings-row:hover{background:var(--surface-hover)}.settings-icon{width:38px;height:38px;border-radius:11px;background:var(--surface-subtle);border:1px solid var(--border);display:grid;place-items:center}.settings-copy{flex:1}.settings-copy strong{display:block;font-size:13px}.settings-copy span{display:block;font-size:11px;color:var(--text-3);margin-top:2px}
.demo-panel{position:fixed;right:18px;bottom:18px;z-index:50;width:min(390px,calc(100vw - 36px));background:rgba(32,41,35,.97);color:white;border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.2);padding:13px}
.demo-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.demo-panel strong{font-size:13px}.demo-panel p{margin:3px 0 0;color:#bdc8c0;font-size:10px}.demo-close{background:transparent;border:0;color:#dfe7e0;cursor:pointer;font-size:18px}
.state-buttons{display:flex;flex-wrap:wrap;gap:7px}.state-btn{border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.07);color:#f4f7f4;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:11px}.state-btn.active{background:#f1dfbd;color:#332515;border-color:#f1dfbd}
.demo-open{position:fixed;right:18px;bottom:18px;z-index:40;border:0;background:#202923;color:white;border-radius:999px;padding:11px 15px;font-weight:760;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.2);display:none}
.backdrop{position:fixed;inset:0;z-index:80;background:rgba(20,25,21,.42);display:none}.backdrop.open{display:block}

:root{

  --shadow:0 10px 30px rgba(35,48,40,.055);--radius:16px;
}
html{scroll-padding-top:96px}
body{background:linear-gradient(180deg,#f7f5ef 0,#f3f1eb 100%)}

.main{min-width:0}

.area-navigation{height:72px;display:flex;align-items:stretch;justify-content:center;gap:34px}
.area-tab{position:relative;min-width:94px;border:0;background:transparent;color:var(--text-3);font-size:13px;font-weight:760;cursor:pointer;padding:0 4px}
.area-tab:hover{color:var(--text)}
.area-tab.active{color:var(--brand-dark)}
.area-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brand)}
.operator-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}

.content{max-width:1500px;padding:34px 40px 76px}

.chip.active{background:var(--brand-light);color:var(--brand-dark);border-color:#9fc1ba}

.insight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:18px}

.metric-pair{display:flex;align-items:flex-end;gap:8px;white-space:nowrap}.metric-pair strong{font-size:27px;line-height:1;font-variant-numeric:tabular-nums}.metric-pair span{color:var(--text-3);font-size:10px;margin-bottom:3px}
.chart-shell{position:relative;height:170px;padding:8px 4px 25px 34px;border-bottom:1px solid var(--border)}
.chart-grid{position:absolute;inset:8px 4px 25px 34px;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(25% - 1px),var(--border-light) 25%)}
.chart-y{position:absolute;left:0;top:5px;bottom:21px;display:flex;flex-direction:column;justify-content:space-between;color:var(--text-3);font-size:9px}
.capacity-bars{position:relative;z-index:1;height:100%;display:flex;align-items:flex-end;gap:8px}
.capacity-day{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.capacity-stack{width:min(34px,70%);height:var(--height);min-height:8px;border-radius:7px 7px 3px 3px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#e5e9e4;border:1px solid #d8ddd7}
.capacity-booked{height:var(--booked);background:linear-gradient(180deg,#5d9390,#3f7778)}
.capacity-day em{font-style:normal;font-size:9px;color:var(--text-3)}
.util-svg{position:relative;z-index:1;width:100%;height:100%;overflow:visible}.util-fill{fill:url(#utilGradient)}.util-line{fill:none;stroke:var(--brand);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.util-dot{fill:#fff;stroke:var(--brand);stroke-width:3}
.chart-legend{display:flex;align-items:center;gap:14px;margin-top:11px;color:var(--text-3);font-size:10px}.legend-key{display:inline-flex;align-items:center;gap:6px}.legend-key::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--brand)}.legend-key.free::before{background:#e5e9e4;border:1px solid #d3d8d2}
.chart-note{margin-left:auto;color:var(--text-2);font-weight:700}
.today-workspace{grid-template-columns:minmax(0,1fr) 350px}

.surface-intro{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,.65fr);gap:16px;margin-bottom:16px}
.customer-search-card{padding:22px}.customer-search-card h2{margin:0;font-size:18px}.customer-search-card p{margin:6px 0 16px;color:var(--text-3);font-size:12px}.customer-search-row{display:flex;gap:8px}.customer-search-row .input{flex:1;min-width:0}
.followup-card{padding:20px;background:linear-gradient(135deg,#fffefa,var(--brand-soft))}.followup-card strong{display:block;font-size:14px}.followup-card p{margin:7px 0 14px;color:var(--text-3);font-size:11px}
.business-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.business-group{padding:18px}.business-group.wide{grid-column:1/-1}.business-group-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.business-group-title h2{margin:0;font-size:16px}.business-group-title p{margin:5px 0 0;color:var(--text-3);font-size:11px}
.business-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.business-link{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px;border:1px solid var(--border-light);border-radius:12px;background:var(--surface-subtle);cursor:pointer;text-align:left;color:inherit}.business-link:hover{background:var(--surface-hover);border-color:var(--border-dark)}.business-link-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:white;border:1px solid var(--border);color:var(--brand-dark)}.business-link strong{display:block;font-size:12px}.business-link small{display:block;margin-top:2px;color:var(--text-3);font-size:10px}.system-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.system-item{padding:13px;border-radius:12px;background:var(--surface-subtle);border:1px solid var(--border-light)}.system-item span{display:block;color:var(--text-3);font-size:10px}.system-item strong{display:block;margin-top:5px;font-size:13px}

@media(max-width:1080px){.operator-header{grid-template-columns:145px minmax(370px,1fr) auto;padding:0 20px}.area-navigation{gap:18px}.operator-actions .search-wrap{display:none}.content{padding-left:24px;padding-right:24px}.today-workspace{grid-template-columns:1fr}.today-rail{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:780px){.operator-header{grid-template-columns:1fr auto;gap:12px;min-height:68px;padding:9px 15px}.operator-brand{align-items:center}.operator-clock{display:none}.area-navigation{display:none}.mobile-area-control{display:block;grid-column:1/-1;width:100%;min-height:40px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);padding:8px 10px;font-weight:700}.operator-actions .demo-top-button{display:none}.content{padding:25px 15px 68px}.insight-grid{grid-template-columns:1fr}.insight-card{min-height:260px}.surface-intro,.business-groups{grid-template-columns:1fr}.business-group.wide{grid-column:auto}.today-rail{grid-template-columns:1fr}.system-strip{grid-template-columns:1fr}.page-head{align-items:flex-start}.operator-actions .scan-indicator span:last-child{display:none}}
@media(max-width:520px){.operator-brand{font-size:14px}.operator-brand .brand-mark{width:29px;height:29px}.operator-actions{gap:5px}.operator-actions .btn{padding-left:9px;padding-right:9px}.business-links{grid-template-columns:1fr}.customer-search-row{flex-direction:column}.chart-note{display:none}.insight-card{padding-left:15px;padding-right:15px}.metric-pair strong{font-size:23px}}


:root { --bento-gap: 14px; }
#pageContent:has(.bento-grid) { max-width: 1450px; }
#pageContent:has(.bento-grid) .page-head { margin-bottom: 24px; }
#pageContent:has(.bento-grid) .page-head h1 { font-size: clamp(30px, 3vw, 39px); font-weight: 790; letter-spacing: -.05em; }
.bento-grid { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); grid-template-rows:minmax(242px,auto) minmax(250px,auto) minmax(213px,auto); gap:var(--bento-gap); align-items:stretch; }
.bento-tile { min-width:0; min-height:0; position:relative; overflow:hidden; border-radius:21px; border:1px solid #e1e3dc; background:#fff; box-shadow:0 5px 22px rgba(28,37,27,.035); padding:22px; }
.bento-head { display:flex; align-items:center; gap:9px; font-size:10px; letter-spacing:.11em; font-weight:810; text-transform:uppercase; color:#647066; }
.bento-head .bento-glyph { width:26px;height:26px;display:grid;place-items:center;background:#f2f4ef;border:1px solid #e8ece5;border-radius:9px;font-size:14px;letter-spacing:0; color:#466155; }

.bento-muted { color:#71796f; font-size:12px; }
.bento-arrow { font-size:17px; color:inherit; opacity:.6; line-height:1; }
.bento-link { border:0; background:none; display:inline-flex; align-items:center; gap:7px; cursor:pointer; color:#5b693b; font-size:12px; font-weight:750; padding:0; }
.bento-link:hover { text-decoration:underline; }
.bento-today { grid-column:span 7; grid-row:span 2; padding:25px 27px 19px; background:linear-gradient(145deg,#ffffff 15%,#fbfcfa 62%,#f6f9f5 100%); display:flex; flex-direction:column; }
.bento-today::after { content:""; pointer-events:none; position:absolute; top:-148px; right:-180px; width:440px; height:350px; border-radius:50%; background:radial-gradient(ellipse at center,rgba(91,125,98,.10),transparent 66%); }
.bento-today-head { display:flex; justify-content:space-between; align-items:center; gap:10px; position:relative; z-index:1; }

.bento-hero-summary { display:flex; align-items:center; justify-content:space-between; gap:15px; padding:22px 0 18px; border-bottom:1px solid #e6eae3; position:relative; z-index:1; }
.bento-numline { display:flex; align-items:baseline; gap:13px; }

.bento-noun { max-width:170px; line-height:1.18; font-weight:730; font-size:16px; color:#33473a; }
.bento-summary-note { margin-top:9px; font-size:12px; color:#778177; }

.bento-agenda-label { display:flex; justify-content:space-between; gap:12px; align-items:center; margin:16px 0 9px; }

.bento-agenda-label span { font-size:11px; color:#7b857c; }
.bento-agenda { display:grid; gap:5px; flex:1; }
.bento-appointment { border:1px solid transparent; background:transparent; display:grid; grid-template-columns:66px 15px minmax(0,1fr) auto; gap:11px; align-items:center; width:100%; text-align:left; border-radius:11px; padding:10px 12px 10px 6px; cursor:pointer; color:var(--text); min-width:0; }
.bento-appointment:hover { background:#f4f6f1; }
.bento-appointment:first-child { background:#f0f5ef; border-color:#e1eae0; }

.bento-appointment .timeline-dot { width:9px; height:9px; border:2px solid #6f8f7d; border-radius:50%; display:block; justify-self:center; position:relative; }
.bento-appointment:first-child .timeline-dot { background:#476e5a; box-shadow:0 0 0 4px #dae9dc; }
.bento-client { min-width:0; }
.bento-client strong,.bento-client small { display:block; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
.bento-client strong { font-size:12px; font-weight:760; }
.bento-client small { color:#7b8479; font-size:11px; margin-top:2px; }

.bento-today-footer { margin-top:12px; padding-top:15px; border-top:1px solid #e6eae3; display:flex; justify-content:space-between; align-items:center; gap:12px; }

.bento-capacity { grid-column:span 3; padding:21px 20px 19px; display:flex; flex-direction:column; justify-content:space-between; }

.bento-capacity-ring { --p:74%; align-self:center; width:133px; height:133px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(#4a725c 0 var(--p),#e7eee8 var(--p) 100%); margin:11px 0 8px; }

/* Bento adaptation for Salon Flow: same hierarchy, Petrol design and retained analytics */
.bento-grid{grid-template-rows:minmax(235px,auto) minmax(237px,auto) minmax(250px,auto) minmax(212px,auto)}
.bento-tile{border-color:#e0e5de;box-shadow:0 7px 23px rgba(28,54,50,.042)}
.bento-today{background:linear-gradient(135deg,#fffefa 14%,#f9fcf9 72%,#ecf4f1 100%)}
.bento-today::after{background:radial-gradient(ellipse at center,rgba(63,119,120,.09),transparent 70%)}
.bento-number{color:#244747}.bento-noun{color:#335757}
.bento-next-pill{background:#eaf3f1;border-color:#d5e8e4}.bento-next-pill strong{color:#285e60}
.bento-today .bento-link,.bento-actions .bento-link{color:#2f696a}
.bento-appointment:first-child{background:#edf5f3;border-color:#dfece9}
.bento-appointment:first-child .timeline-dot{background:#3f7778;box-shadow:0 0 0 4px #dcece8}
.bento-staff{background:#e7f0ed;color:#376c6b}
.bento-priority{background:linear-gradient(135deg,#fffaf0,#fffdf9)}
.bento-growth{background:#244746;border-color:#244746}.bento-growth .bento-glyph{background:#315b58;border-color:#46726e}
.bento-growth .bento-head{color:#b5d2ca}
.bento-online{background:#eff6f5;border-color:#e1eae8}.bento-online .bento-glyph{background:#e0eeeb;color:#3f7778}
.bento-online .bento-head,.bento-online .bento-online-visual{color:#457a78}.bento-online-value{color:#2d615f}.bento-online button{color:#2f6665}
.bento-capacity{display:none}
.bento-today{grid-column:span 7;grid-row:span 2}
.bento-priority{grid-column:span 5}
.bento-online{grid-column:span 2;min-width:0}
.bento-growth{grid-column:span 3}
.bento-insight{grid-column:span 6;padding:21px 23px 18px;display:flex;flex-direction:column}
.bento-insight .insight-card-head{margin:9px 0 0;gap:10px}.bento-insight .insight-card-head h2{font-size:16px}
.bento-insight .chart-shell{height:156px;margin-top:auto;padding-top:15px}.bento-insight .chart-legend{margin-top:10px;gap:8px}
.bento-insight .metric-pair strong{font-size:25px}.bento-insight .chart-note{font-size:10px}
.bento-upcoming{grid-column:span 7}.bento-actions{grid-column:span 5}
.bento-actions .bento-action-list{grid-template-columns:repeat(2,minmax(0,1fr))}
.bento-actions .bento-quick-button{min-height:47px}
.bento-mini-spark{flex:0 0 86px;align-self:flex-end;width:110px;height:66px}
.bento-actions,.bento-upcoming{min-height:205px}
@media(max-width:1190px){
 .bento-grid{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:auto}
 .bento-today{grid-column:span 6;grid-row:auto;min-height:430px}.bento-priority{grid-column:span 6}
 .bento-online{grid-column:span 3;min-height:205px}.bento-growth{grid-column:span 3;min-height:205px}
 .bento-insight{grid-column:span 3;min-height:275px}
 .bento-upcoming{grid-column:span 3}.bento-actions{grid-column:span 3}
 .bento-actions .bento-action-list{grid-template-columns:1fr}
 .bento-insight .chart-note{display:none}
}
@media(max-width:740px){
 .bento-grid{grid-template-columns:1fr}.bento-grid>.bento-tile{grid-column:1/-1;grid-row:auto}
 .bento-insight{min-height:265px}.bento-today{min-height:0}
 .bento-actions .bento-action-list{grid-template-columns:repeat(2,minmax(0,1fr))}
 .bento-insight .chart-note{display:block}
}
@media(max-width:440px){.bento-actions .bento-action-list{grid-template-columns:1fr}.bento-mini-spark{display:none}.bento-tile{padding:18px}}

/* Calendar navigation — native day planner integrated with the application */
.calnav{--cal-time-col:66px;--cal-slot:57px;--cal-person-min:174px;margin-top:4px}
.calnav-tools{padding:11px 17px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--border-light)}
.calnav-date{display:flex;align-items:center;gap:4px;min-width:0}
.calnav-icon{height:39px;min-width:39px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;font-size:22px;color:var(--text-2);cursor:pointer}
.calnav-icon:hover{background:var(--surface-hover)}
.calnav-date-picker{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:162px;height:39px;overflow:hidden;border-radius:10px}
.calnav-date-picker:hover{background:var(--surface-hover)}
.calnav-date-picker strong{font-size:13px;font-weight:760;pointer-events:none}
.calnav-date-picker input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;color-scheme:light}
.calnav-today{min-height:39px;white-space:nowrap;border:0;background:transparent;color:var(--brand-dark);font-weight:750;border-radius:10px;padding:0 12px;cursor:pointer}
.calnav-today:hover{background:var(--brand-light)}
.calnav-today.paused{background:#e8eeeb}
.calnav-segment{display:flex;padding:3px;border-radius:11px;background:var(--surface-subtle);border:1px solid var(--border-light);gap:2px}
.calnav-segment button{padding:8px 12px;border:0;background:transparent;color:var(--text-2);border-radius:8px;cursor:pointer;font-size:12px;font-weight:750}
.calnav-segment button.active{background:var(--surface);color:var(--brand-dark);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.calnav-staffwrap{position:relative}.calnav-staffbutton{height:39px;border:1px solid var(--border);padding:0 12px;border-radius:10px;background:var(--surface);font-size:12px;font-weight:750;cursor:pointer}
.calnav-menu{position:absolute;z-index:20;top:43px;right:0;width:245px;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);background:var(--surface);padding:8px}
.calnav-menu .menu-header{padding:7px 9px;font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-weight:850}
.calnav-menu button{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:0;border-radius:9px;padding:10px;text-align:left;font-size:12px;cursor:pointer}
.calnav-menu button:hover{background:var(--surface-hover)}
.calnav-menu button[aria-checked=true]{font-weight:760;color:var(--brand-dark)}
.calnav-check{width:19px;height:19px;border:1px solid var(--border-dark);border-radius:5px;display:grid;place-items:center}
.calnav-menu [aria-checked=true] .calnav-check{background:var(--brand);color:#fff;border-color:var(--brand)}
.calnav-menu-footer{border-top:1px solid var(--border-light);margin-top:4px;padding-top:5px}
.calnav-space{flex:1}
.calnav-search{width:175px;min-height:39px;min-width:80px}
.calnav-location{min-height:39px;max-width:156px;font-size:12px}
.calnav-status{padding:10px 17px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;color:var(--text-3);font-size:11px;background:#fafbf8;border-bottom:1px solid var(--border-light)}
.calnav-status .calnav-legend{display:flex;gap:15px;flex-wrap:wrap}
.calnav-status .swatch{width:9px;height:9px;border-radius:3px;display:inline-block;background:#609b98;margin-right:4px}
.calnav-status .swatch.request{background:#d99a1a}.calnav-status .swatch.blocked{background:#a1a7a0}
.calday-scroll{height:min(69vh,710px);min-height:370px;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;background:var(--surface)}
.calday-board{width:max(100%,calc(var(--cal-time-col) + var(--cal-count)*var(--cal-person-min)))}
.calday-head{display:grid;grid-template-columns:var(--cal-time-col) repeat(var(--cal-count),minmax(var(--cal-person-min),1fr));position:sticky;top:0;z-index:11;min-height:52px;background:#f7f9f6;border-bottom:1px solid var(--border)}
.calday-head>div{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border-light);font-size:12px;font-weight:760;white-space:nowrap;min-width:0}
.calday-head>div:first-child{position:sticky;left:0;background:#f7f9f6;z-index:12;color:var(--text-3);font-weight:600}
.calday-head .calday-mobile-focus{display:none}
.calday-body{height:calc(22 * var(--cal-slot));position:relative;display:grid;grid-template-columns:var(--cal-time-col) repeat(var(--cal-count),minmax(var(--cal-person-min),1fr));grid-template-rows:repeat(22,var(--cal-slot));background:var(--surface)}
.calday-time{position:sticky;left:0;z-index:5;background:#fafbf8;color:var(--text-3);font-size:11px;padding:8px 6px;text-align:center;border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light)}
.calday-cell{border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light)}
.calday-cell:nth-of-type(odd){background:rgba(63,119,120,.008)}
.calday-appt{position:absolute;z-index:6;overflow:hidden;background:#e9f3f1;border:0;border-left:4px solid var(--brand);border-radius:9px;color:#234845;text-align:left;padding:8px 9px;cursor:pointer;box-shadow:0 1px 4px rgba(25,63,60,.08);touch-action:manipulation}
.calday-appt:hover{background:#deefeb;box-shadow:0 3px 9px rgba(25,63,60,.12)}
.calday-appt strong,.calday-appt span,.calday-appt small{display:block;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.calday-appt strong{font-size:12px}.calday-appt span{font-size:10px;margin-top:3px;color:#466b68}.calday-appt small{font-size:10px;margin-top:4px;color:#547875}
.calday-appt.request{border-left-color:#d99a1a;background:#fff5df;color:#735014}
.calday-appt.block{border-left-color:#8a948c;background:#f0f0ed;color:#525a54;background-image:repeating-linear-gradient(135deg,transparent 0 9px,rgba(102,113,106,.05) 9px 18px)}
.calday-appt.pause{background:#f5f3ef;border-left-color:#aeb4ac}
.calday-appt[draggable=true]{cursor:grab}.calday-appt.dragging{opacity:.36}
.calday-now{position:absolute;left:0;right:0;border-top:2px solid #d15b61;z-index:8;pointer-events:none}
.calday-now::before{content:"";position:absolute;top:-5px;left:calc(var(--cal-time-col) - 5px);width:9px;height:9px;background:#d15b61;border-radius:50%}
.calday-now span{position:absolute;left:calc(var(--cal-time-col) + 10px);top:-13px;padding:3px 8px;border-radius:20px;background:#fff0f0;color:#9a4148;font-size:10px;font-weight:800}
.calday-drop{position:absolute;z-index:9;pointer-events:none;background:rgba(63,119,120,.12);border:2px dashed var(--brand);border-radius:8px;color:#245454;font-size:11px;font-weight:750;padding:8px}
.calday-drop.invalid{background:rgba(185,64,64,.08);border-color:#c45a61;color:#a04045}
.calnav-empty{padding:40px 22px;text-align:center;color:var(--text-3);font-size:13px}
.calweek-scroll{overflow-x:auto}.calweek-grid{display:grid;grid-template-columns:repeat(5,minmax(192px,1fr));min-width:880px;gap:12px;padding:16px}
.calweek-col{background:var(--surface-subtle);border:1px solid var(--border-light);border-radius:13px;padding:12px;min-height:300px}
.calweek-col.current{border-color:#9fc1ba;background:#f0f8f5}
.calweek-col-head{font-size:12px;font-weight:800;margin-bottom:13px;color:var(--text-2)}
.calweek-item{display:flex;flex-direction:column;gap:4px;width:100%;margin:8px 0;padding:10px;border:1px solid var(--border-light);border-radius:9px;background:var(--surface);text-align:left;cursor:pointer;font-size:11px}
.calweek-item:hover{border-color:#a4c8c1}.calweek-item strong{font-size:12px}.calweek-item small{color:var(--text-3)}
.calweek-item.request{border-left:3px solid #d99a1a}
.calnav-hint{font-size:10px;color:var(--text-3);padding:10px 16px;border-top:1px solid var(--border-light)}
@media(max-width:1080px){.calnav-search{width:130px}.calnav-tools{gap:7px}.calnav-date-picker{min-width:133px}}
@media(max-width:780px){
 .calnav-tools{padding:9px 10px;gap:6px}.calnav-date{flex:1}.calnav-date-picker{min-width:0;flex:1}
 .calnav-space{display:none}.calnav-staffwrap{display:none}.calnav-search{width:100%;order:4}.calnav-location{max-width:100%;flex:1}
 .calnav-segment{order:3}.calday-board{width:100%;--cal-count:1!important;--cal-person-min:calc(100% - var(--cal-time-col))}
 .calday-head,.calday-body{grid-template-columns:var(--cal-time-col) minmax(0,1fr)}
 .calday-head .calday-desktop-person{display:none}.calday-head .calday-mobile-focus{display:flex;grid-column:2}
 .calday-mobile-focus button{width:100%;height:100%;background:none;border:0;color:var(--text);font-weight:800;cursor:pointer}
 .calday-scroll{height:min(68vh,650px)}.calnav-status .calnav-legend{gap:9px}
 .calnav-mobile-menu{position:fixed;left:10px;right:10px;bottom:10px;top:auto;width:auto;z-index:70;max-height:70vh;overflow:auto}
}
@media(max-width:460px){.calnav-icon{min-width:30px}.calnav-today{padding:0 7px}.calnav-date-picker strong{font-size:12px}.calnav-status{font-size:10px}.calnav-tools{gap:4px}}


/* Mobile calendar toolbar: explicit rows to avoid date picker and filter collision */
.cal-date-mobile{display:none}
@media(max-width:780px){
 .calnav-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:10px}
 .calnav-date{grid-column:1/-1;min-width:0;width:100%;display:flex;gap:2px}
 .calnav-date .calnav-icon{flex:0 0 32px;min-width:32px}
 .calnav-date-picker{min-width:0;flex:1;max-width:none}
 .cal-date-desktop{display:none}.cal-date-mobile{display:inline}
 .calnav-today{flex:0 0 auto;min-width:52px}
 .calnav-segment{grid-column:1;grid-row:2;justify-self:start;order:initial}
 .calnav-location{grid-column:2;grid-row:2;max-width:168px;min-width:0;order:initial}
 .calnav-search{grid-column:1/-1;grid-row:3;order:initial;width:100%}
}

/* Compact location breadcrumb replaces the oversized page headline. */
.page-head.page-head-compact{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:17px;min-height:41px}
.page-head-compact .page-head-copy{min-width:0}
.page-visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.page-breadcrumb{display:flex;align-items:center;gap:10px;min-height:39px;white-space:nowrap;font-size:13px}
.page-breadcrumb-root{border:0;background:transparent;color:#748078;padding:7px 0;cursor:pointer;font-weight:620;text-align:left;border-radius:4px}
.page-breadcrumb-root:hover{color:var(--brand);text-decoration:underline}
.page-breadcrumb-separator{font-size:16px;font-weight:500;color:#adb5ad}
.page-breadcrumb-current{font-weight:790;color:#2b3830}
.page-head-compact .page-context{font-size:11px;color:var(--text-3);margin:0 0 3px}
.page-head-right{min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:15px;flex-wrap:wrap}

.page-demo-date strong{color:#46584a;font-weight:760}
.page-demo-date-icon{height:25px;width:25px;border:1px solid #e4ebe3;border-radius:8px;display:grid;place-items:center;font-size:14px;color:#557161;background:#edf3ec}
.page-head-compact .head-actions{justify-content:flex-end;align-items:center;gap:8px}
.page-head-compact .head-actions .btn{min-height:38px;padding:8px 12px}
#pageContent:has(.bento-grid) .page-head.page-head-compact{margin-bottom:17px}
@media(max-width:960px){
 .page-head.page-head-compact{flex-wrap:wrap}

}
@media(max-width:720px){
 .page-head.page-head-compact{flex-direction:column;align-items:stretch;gap:9px;margin-bottom:15px}

}

 .page-head-compact .head-actions .btn{flex:1;min-width:0}
 .page-head-right{gap:10px}
}

<body>
<div class="app">
  <main class="main">
    <header class="operator-header">
      <div class="operator-brand"><span class="brand-mark">S</span><span>Salon Flow</span><span class="operator-clock" id="operatorClock">10:59</span></div>
      <nav class="area-navigation" id="navigation" aria-label="Hauptbereiche"></nav>
      <div class="operator-actions">
        <button id="scanIndicator" class="scan-indicator" onclick="navigateToScan()"><span class="scan-pulse"></span><span id="scanIndicatorText">Scan läuft</span></button>
        <button class="btn btn-secondary btn-sm demo-top-button" onclick="openDemoPanel()">Demo-Zustände</button>
        <div class="search-wrap"><input id="globalSearch" class="search" placeholder="Suchen oder Aktion starten" onfocus="openCommandPalette()" onkeydown="globalSearch(event)"><span class="search-key">⌘K</span></div>
        <button type="button" class="avatar" onclick="toggleProfileMenu(event)" aria-label="Profilmenü öffnen">SG</button>
      </div>
      <select class="mobile-area-control" id="mobileAreaSelect" aria-label="Hauptbereich wählen" onchange="navigate(this.value)">
        <option value="today">Tagesplan</option><option value="bookings">Termine</option><option value="customers">Kundenkartei</option><option value="business">Betrieb</option>
      </select>
    </header>
    <div class="content" id="pageContent"></div>
  </main>
</div>

<div class="demo-panel" id="demoPanel">
  <div class="demo-panel-head">
    <div><strong>Demo-Zustand</strong><p id="demoHint">Zustände dieser Seite wechseln</p></div>
    <button class="demo-close" onclick="closeDemoPanel()" title="Schliessen">×</button>
  </div>
  <div class="state-buttons" id="stateButtons"></div>
  <div class="demo-audit-actions">
    <button class="state-btn" onclick="openAuditCoverage()">✓ Audit 36/36</button>
    <button class="state-btn" onclick="openStatusModel()">Statusmodell</button>
  </div>
</div>
<button class="demo-open" id="demoOpen" onclick="openDemoPanel()">Demo-Zustände</button>

<div class="backdrop" id="drawerBackdrop" onclick="drawerBackdropClose(event)">
  <aside class="drawer" id="drawer"></aside>
</div>
<div class="modal-wrap" id="modalWrap" onclick="modalBackdropClose(event)">
  <div class="modal" id="modal"></div>
</div>
<div class="command-wrap" id="commandWrap" onclick="commandBackdropClose(event)">
  <div class="command">
    <input id="commandSearch" class="command-search" placeholder="Kunde, Termin, Person, Leistung, Standort oder Aktion …" oninput="renderCommandResults(this.value)" onkeydown="commandKeydown(event)">
    <div class="command-results" id="commandResults"></div>
  </div>
</div>
<div class="profile-menu" id="profileMenu">
  <button onclick="demoToast('Profil geöffnet')">Profil</button>
  <button onclick="navigate('settings');closeProfileMenu()">Einstellungen</button>
  <button onclick="demoToast('Abmeldung wäre hier verfügbar')">Abmelden</button>
</div>
<div class="toast" id="toast"></div>

/* Integrated calendar navigation adapted from the supplied SalonFlow day-plan prototype.
   The data and actions remain in this local demo; no backend availability checks occur. */
const calendarDemoDate='2026-07-20';
const calendarState={date:calendarDemoDate,view:'day',focused:'Belinda',search:'',staffMenu:false,mobileMenu:false,followNow:false,lastScrollKey:'',scrollTop:110};
const calendarEntries=bookings.map(b=>({id:b.id,date:b.date==='Heute'?calendarDemoDate:b.date==='Morgen'?'2026-07-21':'2026-07-19',staff:b.staff,start:calendarMinutes(b.time),duration:parseInt(b.duration,10)||45,kind:b.status==='Anfrage'?'request':'appointment',name:b.name,service:b.service})).concat([
 {id:'break-elma',date:calendarDemoDate,staff:'Elma',start:14*60,duration:30,kind:'pause',name:'Pause',service:'Nicht buchbar'},
 {id:'block-nadine',date:calendarDemoDate,staff:'Nadine',start:12*60,duration:60,kind:'block',name:'Schulung',service:'Interne Zeit'}
]);
function calendarMinutes(s){const [h,m]=s.split(':').map(Number);return h*60+m}
function calendarClock(minutes){return `${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}`}
function calendarDateObj(key){const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d,12)}
function calendarKey(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function calendarToday(){return calendarKey(new Date())}
function calendarShiftDate(key,delta){const d=calendarDateObj(key);d.setDate(d.getDate()+delta);return calendarKey(d)}
function calendarShortDate(key){return new Intl.DateTimeFormat('de-CH',{weekday:'short',day:'numeric',month:'short'}).format(calendarDateObj(key))}
function calendarLongDate(key){return new Intl.DateTimeFormat('de-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(calendarDateObj(key))}
function calendarWeekStart(key){const d=calendarDateObj(key);d.setDate(d.getDate()-(d.getDay()+6)%7);return calendarKey(d)}
function calendarFilteredStaff(){return staff.map(s=>s.name.split(' ')[0]).filter(n=>calendarSelected.has(n)&&(calendarLocation.startsWith('Alle')||staff.find(s=>s.name.startsWith(n)).locations.includes(calendarLocation)))}
function calendarDesktop(){return !window.matchMedia('(max-width:780px)').matches}
function calendarPeople(){const everyone=calendarFilteredStaff();if(!everyone.includes(calendarState.focused))calendarState.focused=everyone[0]||'';return calendarDesktop()?everyone:everyone.filter(n=>n===calendarState.focused)}
function calendarShownEntries(date,people){return calendarEntries.filter(a=>a.date===date&&people.includes(a.staff)&&(`${a.name} ${a.service} ${a.staff}`.toLowerCase().includes(calendarState.search.toLowerCase())))}
function calendarSetDate(key){if(!/^\d{4}-\d{2}-\d{2}$/.test(key)||Number.isNaN(calendarDateObj(key).getTime()))return;calendarState.date=key;calendarState.followNow=key===calendarToday();calendarState.staffMenu=false;calendarState.mobileMenu=false;calendarState.lastScrollKey='';renderPage()}
function calendarNext(delta){calendarSetDate(calendarShiftDate(calendarState.date,delta*(calendarState.view==='week'?7:1)))}
function calendarJumpToday(){if(calendarState.date!==calendarToday()){calendarSetDate(calendarToday())}else{calendarState.followNow=true;renderPage();calendarScrollToNow()}}
function calendarSetView(view){if(!['day','week'].includes(view))return;calendarState.view=view;calendarState.staffMenu=false;calendarState.mobileMenu=false;calendarState.lastScrollKey='';renderPage()}
function calendarSelectLocation(value){calendarLocation=value;calendarState.lastScrollKey='';renderPage()}
function calendarToggleStaff(name){if(calendarSelected.has(name)){if(calendarSelected.size===1){demoToast('Mindestens eine Person muss ausgewählt bleiben.');return}calendarSelected.delete(name)}else calendarSelected.add(name);calendarState.lastScrollKey='';renderPage()}
function calendarSetAllStaff(){calendarSelected=new Set(staff.map(s=>s.name.split(' ')[0]));calendarState.lastScrollKey='';renderPage()}
function calendarSetFocus(name){if(!calendarSelected.has(name))calendarSelected.add(name);calendarState.focused=name;calendarState.mobileMenu=false;calendarState.lastScrollKey='';renderPage()}
function calendarToggleMenu(type){if(type==='staff'){calendarState.staffMenu=!calendarState.staffMenu;calendarState.mobileMenu=false}else{calendarState.mobileMenu=!calendarState.mobileMenu;calendarState.staffMenu=false}renderPage()}
function calendarFilterSearch(value){calendarState.search=value;const container=document.getElementById('calViewContainer');if(!container)return;const scroll=document.getElementById('caldayScroll');const y=scroll?.scrollTop||0;container.innerHTML=calendarState.view==='day'?calendarDay():calendarWeek();const next=document.getElementById('caldayScroll');if(next)next.scrollTop=y}
function calendarStaffMenu(mobile=false){const names=staff.map(s=>s.name.split(' ')[0]);return `<div class="calnav-menu ${mobile?'calnav-mobile-menu':''}" role="menu" aria-label="Mitarbeitende wählen"><div class="menu-header">${mobile?'Person im Tagesplan':'Sichtbare Mitarbeitende'}</div>${names.map(n=>`<button role="menuitemcheckbox" aria-checked="${calendarSelected.has(n)}" onclick="calendarToggleStaff('${n}')"><span class="calnav-check">${calendarSelected.has(n)?'✓':''}</span>${n}${mobile&&n===calendarState.focused?' · aktiv':''}</button>`).join('')}<div class="calnav-menu-footer"><button onclick="calendarSetAllStaff()">✓ Alle auswählen</button>${mobile?names.filter(n=>calendarSelected.has(n)).map(n=>`<button onclick="calendarSetFocus('${n}')" ${n===calendarState.focused?'aria-current="true"':''}>${n===calendarState.focused?'●':'○'} ${n} anzeigen</button>`).join(''):''}<button onclick="calendarState.staffMenu=false;calendarState.mobileMenu=false;renderPage()">Fertig</button></div></div>`}
function renderCalendar(){

 const isToday=calendarState.date===calendarToday();
 const todayLabel=!isToday?'Heute':calendarState.followNow?'Jetzt':'Jetzt ↩';
 const people=calendarFilteredStaff();
 const staffLabel=calendarSelected.size===staff.length?'Mitarbeitende ▾':`Mitarbeitende · ${calendarSelected.size}/${staff.length} ▾`;
 const viewCaption=calendarState.view==='day'?calendarLongDate(calendarState.date):`${calendarShortDate(calendarWeekStart(calendarState.date))} – ${calendarShortDate(calendarShiftDate(calendarWeekStart(calendarState.date),4))}`;
 return pageHeader('Kalender','Tagesnavigation, Team- und Standortfilter · Demo-Daten vom 20./21. Juli 2026.',actions)+`<section class="card calnav" aria-label="Kalendernavigation">
 <div class="calnav-tools">
 <div class="calnav-date"><button type="button" class="calnav-icon" aria-label="${calendarState.view==='week'?'Vorherige Woche':'Vorheriger Tag'}" onclick="calendarNext(-1)">‹</button><label class="calnav-date-picker"><strong><span class="cal-date-desktop">${viewCaption}</span><span class="cal-date-mobile">${calendarShortDate(calendarState.date)}</span></strong><input type="date" value="${calendarState.date}" aria-label="Kalenderdatum auswählen" onchange="calendarSetDate(this.value)"/></label><button type="button" class="calnav-icon" aria-label="${calendarState.view==='week'?'Nächste Woche':'Nächster Tag'}" onclick="calendarNext(1)">›</button><button type="button" class="calnav-today ${isToday&&!calendarState.followNow?'paused':''}" aria-label="${isToday?'Zu Jetzt springen':'Zum heutigen Datum springen'}" onclick="calendarJumpToday()">${todayLabel}</button></div>
 <div class="calnav-segment" aria-label="Kalenderansicht"><button class="${calendarState.view==='day'?'active':''}" aria-pressed="${calendarState.view==='day'}" onclick="calendarSetView('day')">Tag</button><button class="${calendarState.view==='week'?'active':''}" aria-pressed="${calendarState.view==='week'}" onclick="calendarSetView('week')">Woche</button></div>
 <div class="calnav-space"></div><div class="calnav-staffwrap"><button class="calnav-staffbutton" aria-haspopup="menu" aria-expanded="${calendarState.staffMenu}" onclick="calendarToggleMenu('staff')">${staffLabel}</button>${calendarState.staffMenu?calendarStaffMenu():''}</div>
 <select class="select calnav-location" aria-label="Standort filtern" onchange="calendarSelectLocation(this.value)"><option ${calendarLocation==='Alle Standorte'?'selected':''}>Alle Standorte</option><option ${calendarLocation==='Grenchen'?'selected':''}>Grenchen</option><option ${calendarLocation==='Solothurn'?'selected':''}>Solothurn</option></select>
 <input class="input calnav-search" aria-label="Termine suchen" placeholder="Name oder Leistung" value="${escapeHtml(calendarState.search)}" oninput="calendarFilterSearch(this.value)"/>
 </div>
 <div class="calnav-status"><div class="calnav-legend"><span><i class="swatch"></i>Bestätigt</span><span><i class="swatch request"></i>Anfrage</span><span><i class="swatch blocked"></i>Blockiert / Pause</span></div><span>${people.length} von ${staff.length} Personen · ${calendarLocation} · Demo-Daten: 19.–21. Juli 2026</span></div>
 <div id="calViewContainer">${calendarState.view==='day'?calendarDay():calendarWeek()}</div>
 <div class="calnav-hint">${calendarState.view==='day'?'Desktop: einzelne Termine in 15-Minuten-Schritten ziehen oder per Termin-Detail verschieben. Mobil: Person oben im Kalender auswählen.':'Wochenübersicht für den schnellen Wechsel zwischen Tagen. Ein Tag lässt sich direkt öffnen.'} Änderungen in dieser Datei sind nur lokal und werden nicht gespeichert.</div>
 </section>`;
}
function calendarDay(){
 const people=calendarPeople();if(!people.length)return `<div class="calnav-empty">Für diesen Standort ist keine ausgewählte Person sichtbar. Bitte Standort oder Mitarbeitendenfilter anpassen.</div>`;
 const n=people.length,mobile=!calendarDesktop();const date=calendarState.date;
 const visible=calendarShownEntries(date,people),empty=pageState==='empty';
 const head=`<div class="calday-head"><div>Zeit</div>${mobile?`<div class="calday-mobile-focus"><button aria-haspopup="menu" aria-expanded="${calendarState.mobileMenu}" onclick="calendarToggleMenu('mobile')">${escapeHtml(people[0])} ▾</button></div>`:people.map(n=>`<div class="calday-desktop-person">${escapeHtml(n)}</div>`).join('')}</div>`;
 let slots='';for(let i=0;i<22;i++){const t=480+i*30;slots+=`<div class="calday-time" style="grid-row:${i+1};grid-column:1">${calendarClock(t)}</div>`;people.forEach((_,ci)=>{slots+=`<div class="calday-cell" style="grid-row:${i+1};grid-column:${ci+2}" ondblclick="openModal('Neue Buchung',bookingForm())"></div>`})}
 let apps='';if(!empty)visible.forEach(a=>{
  const ci=people.indexOf(a.staff),top=(a.start-480)*57/30+4,height=Math.max(35,a.duration*57/30-8);
  if(ci<0||a.start+a.duration<=480||a.start>=1140)return;
  const draggable=a.kind==='appointment'&&a.duration<=90&&calendarDesktop();
  apps+=`<button type="button" class="calday-appt ${a.kind==='request'?'request':a.kind==='block'?'block':a.kind==='pause'?'pause':''}" style="top:${top}px;height:${height}px;left:calc(var(--cal-time-col) + (100% - var(--cal-time-col)) / ${n} * ${ci} + 5px);width:calc((100% - var(--cal-time-col)) / ${n} - 10px)" ${draggable?`draggable="true" ondragstart="calendarStartDrag(event,${a.id})" ondragend="calendarDragEnd(event)"`:''} onclick="${typeof a.id==='number'?`openCalendarAppointment(${a.id})`:`demoToast('${a.name} · interne Zeit')`}" aria-label="${escapeHtml(a.name)}, ${escapeHtml(a.service)}, ${calendarClock(a.start)} bis ${calendarClock(a.start+a.duration)}, ${escapeHtml(a.staff)}"><strong>${escapeHtml(a.name)}</strong><span>${escapeHtml(a.service)}</span><small>${calendarClock(a.start)}–${calendarClock(a.start+a.duration)}</small></button>`;
 });
 const now=new Date(),time=now.getHours()*60+now.getMinutes(),nowLine=date===calendarToday()&&time>=480&&time<=1140?`<div class="calday-now" id="caldayNow" style="top:${(time-480)*57/30}px"><span>Jetzt ${calendarClock(time)}</span></div>`:'';
 return `<div class="calday-scroll" id="caldayScroll" onscroll="calendarOnScroll(event)"><div class="calday-board" style="--cal-count:${n}">${head}<div class="calday-body" id="caldayBody" ondragover="calendarDragOver(event)" ondragleave="calendarDragLeave(event)" ondrop="calendarDrop(event)">${slots}${apps}${nowLine}</div></div></div>${calendarState.mobileMenu?calendarStaffMenu(true):''}`;
}
function calendarWeek(){const base=calendarWeekStart(calendarState.date),people=calendarFilteredStaff();let cols='';for(let i=0;i<5;i++){
 const key=calendarShiftDate(base,i),entries=pageState==='empty'?[]:calendarShownEntries(key,people).sort((a,b)=>a.start-b.start);
 cols+=`<div class="calweek-col ${key===calendarState.date?'current':''}"><button class="calweek-col-head" style="border:0;background:transparent;cursor:pointer;width:100%;text-align:left" onclick="calendarSetDate('${key}');calendarSetView('day')">${calendarShortDate(key)} ↗</button>${entries.length?entries.map(a=>`<button class="calweek-item ${a.kind==='request'?'request':''}" onclick="${typeof a.id==='number'?`openCalendarAppointment(${a.id})`:`demoToast('Interne Zeit')`}"><span>${calendarClock(a.start)}–${calendarClock(a.start+a.duration)}</span><strong>${escapeHtml(a.name)}</strong><small>${escapeHtml(a.staff)} · ${escapeHtml(a.service)}</small></button>`).join(''):`<div style="padding:10px;color:var(--text-3);font-size:11px">Keine Einträge</div>`}</div>`;
 }return `<div class="calweek-scroll"><div class="calweek-grid">${cols}</div></div>`}
function initCalendarView(){
 const scroll=document.getElementById('caldayScroll');if(!scroll)return;
 const key=calendarState.date+':'+calendarState.view;
 if(calendarState.lastScrollKey!==key){scroll.scrollTop=calendarState.date===calendarToday()?0:108;calendarState.lastScrollKey=key;if(calendarState.date===calendarToday()&&calendarState.followNow)requestAnimationFrame(calendarScrollToNow)}
 else scroll.scrollTop=calendarState.scrollTop;
}
function calendarScrollToNow(){if(calendarState.date!==calendarToday())return;const scroll=document.getElementById('caldayScroll');if(!scroll)return;const now=new Date(),minutes=now.getHours()*60+now.getMinutes();if(minutes<480||minutes>1140)return;const top=(minutes-480)*57/30;calendarState.programmaticScroll=true;scroll.scrollTop=Math.max(0,top-scroll.clientHeight*.25+52);calendarState.scrollTop=scroll.scrollTop;requestAnimationFrame(()=>{calendarState.programmaticScroll=false})}
function calendarOnScroll(e){calendarState.scrollTop=e.target.scrollTop;if(calendarState.date===calendarToday()&&calendarState.followNow&&!calendarState.programmaticScroll){calendarState.followNow=false;const btn=document.querySelector('.calnav-today');if(btn){btn.textContent='Jetzt ↩';btn.classList.add('paused')}clearTimeout(calendarState.followTimer);calendarState.followTimer=setTimeout(()=>{if(activePage==='calendar'&&calendarState.date===calendarToday()){calendarState.followNow=true;const b=document.querySelector('.calnav-today');if(b){b.textContent='Jetzt';b.classList.remove('paused')}calendarScrollToNow()}},20000)}}
function calendarStartDrag(e,id){const a=calendarEntries.find(a=>a.id===id);if(!a||a.kind!=='appointment'||a.duration>90){e.preventDefault();return}calendarState.dragId=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(id));requestAnimationFrame(()=>e.target.classList.add('dragging'))}
function calendarDropTarget(e){const body=document.getElementById('caldayBody');if(!body)return null;const r=body.getBoundingClientRect();const people=calendarPeople();const width=(r.width-66)/people.length;const ci=Math.floor((e.clientX-r.left-66)/width);const name=people[ci];const a=calendarEntries.find(a=>a.id===calendarState.dragId);if(!name||!a)return null;const minutes=480+Math.round(((e.clientY-r.top)/57*30)/15)*15;return {name,minutes,index:ci,width,height:a.duration*57/30-8,entry:a,valid:minutes>=480&&minutes+a.duration<=1140}}
function calendarDragOver(e){if(calendarState.dragId==null)return;e.preventDefault();const t=calendarDropTarget(e),body=document.getElementById('caldayBody');let marker=document.getElementById('caldayDragPreview');if(!marker){marker=document.createElement('div');marker.className='calday-drop';marker.id='caldayDragPreview';body.appendChild(marker)}if(!t){marker.style.display='none';return}marker.style.display='block';marker.classList.toggle('invalid',!t.valid);marker.style.left=`calc(var(--cal-time-col) + (100% - var(--cal-time-col)) / ${calendarPeople().length} * ${t.index} + 5px)`;marker.style.width=`calc((100% - var(--cal-time-col)) / ${calendarPeople().length} - 10px)`;marker.style.top=`${(t.minutes-480)*57/30+4}px`;marker.style.height=`${t.height}px`;marker.textContent=t.valid?`${calendarClock(t.minutes)} · ${t.name}`:'Nicht ablegbar'}
function calendarDragLeave(e){if(!e.currentTarget.contains(e.relatedTarget))document.getElementById('caldayDragPreview')?.remove()}
function calendarDrop(e){e.preventDefault();const target=calendarDropTarget(e);document.getElementById('caldayDragPreview')?.remove();calendarState.dragId=null;if(!target||!target.valid){demoToast('Hier ist das Verschieben nicht möglich.');renderPage();return}calendarMoveEntry(target.entry.id,calendarState.date,target.minutes,target.name)}
function calendarDragEnd(e){e.target.classList.remove('dragging');calendarState.dragId=null;document.getElementById('caldayDragPreview')?.remove()}
function calendarMoveEntry(id,key,minutes,name){const a=calendarEntries.find(x=>x.id===id);if(!a||a.kind!=='appointment'&&a.kind!=='request')return;if(minutes<480||minutes+a.duration>1140){demoToast('Ausserhalb der Öffnungszeit (08:00–19:00).');return false}const conflict=calendarEntries.some(other=>other.id!==id&&other.date===key&&other.staff===name&&minutes<other.start+other.duration&&minutes+a.duration>other.start);if(conflict){demoToast('Konflikt: Dieses Zeitfenster ist bereits belegt.');return false}
 a.start=minutes;a.staff=name;a.date=key;const b=bookings.find(x=>x.id===id);if(b){b.time=calendarClock(minutes);b.staff=name;b.date=key===calendarDemoDate?'Heute':key==='2026-07-21'?'Morgen':new Intl.DateTimeFormat('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'}).format(calendarDateObj(key))}

function startDemoScan(){
 if(scanPhase<5){demoToast('Eine Website-Prüfung läuft bereits.');navigateToScan();return}
 scanPhase=0;demoStorage.setItem('gwsDemoScanPhase',String(scanPhase));pageState='scan';updateScanIndicator();renderPage();resumeScanTimer();
}
function resumeScanTimer(){
 if(scanTimer||scanPhase>=5)return;
 scanTimer=setInterval(()=>{scanPhase++;demoStorage.setItem('gwsDemoScanPhase',String(scanPhase));updateScanIndicator();if(activePage==='website')renderPage();if(scanPhase>=5){clearInterval(scanTimer);scanTimer=null;demoToast('Website-Prüfung abgeschlossen.');}},1300);
}
function pauseDemoScan(){if(scanTimer){clearInterval(scanTimer);scanTimer=null;demoToast('Scan pausiert. Er kann später fortgesetzt werden.')}else{resumeScanTimer();demoToast('Scan fortgesetzt.')}}
function resetDemoScan(){scanPhase=5;demoStorage.setItem('gwsDemoScanPhase','5');updateScanIndicator();renderPage()}
function navigateToScan(){activePage='website';pageState='scan';location.hash='website';renderNavigation();renderPage();if(scanPhase<5)resumeScanTimer()}
function updateScanIndicator(){
 const el=document.getElementById('scanIndicator');if(!el)return;
 el.classList.toggle('show',scanPhase<5);document.getElementById('scanIndicatorText').textContent=scanPhase<5?`Website-Prüfung · Phase ${Math.min(scanPhase+1,5)}/5`:'';
}
