<!doctype html>
<html lang="de" data-mode="light" data-tone="studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gasserwerk Dashboard – vollständige lokale Demo</title>
<style>
:root{
  --bg:#f4f3ef;--bg-2:#efeee9;--surface:#fff;--surface-subtle:#f8f8f5;--surface-hover:#f2f2ed;
  --text:#20231f;--text-2:#555e55;--text-3:#687168;--border:#dfe3dc;--border-light:#e8ebe5;--border-dark:#c9d0c6;
  --brand:#955f18;--brand-dark:#6d430e;--brand-light:#f5ead7;--brand-soft:#fbf6ed;
  --daily:#425f55;--daily-bg:#edf3f0;--online:#60768d;--online-bg:#eff3f7;--ops:#7a664c;--ops-bg:#f5f1e9;
  --warning:#8a5a00;--warning-bg:#fff8e6;--warning-border:#d99a1a;
  --danger:#9f1d1d;--danger-bg:#fff1f1;--danger-border:#dc2626;
  --success:#17663c;--success-bg:#edf8f1;--success-border:#54a478;
  --info:#1e4f73;--info-bg:#eef6fb;--info-border:#8eb7d0;
  --shadow:0 8px 26px rgba(35,40,35,.055);--shadow-lg:0 24px 80px rgba(20,28,22,.22);
  --radius:14px;--radius-sm:10px;--sidebar:246px;
}
*{box-sizing:border-box}
html{color-scheme:light;scroll-behavior:smooth}
body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit}button,a{-webkit-tap-highlight-color:transparent}
a{color:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#202923;color:#f6f6f1;padding:18px 13px;border-right:1px solid rgba(255,255,255,.07);z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:5px 8px 21px;font-weight:780;letter-spacing:-.02em}
.brand-mark{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:#f1dfbd;color:#3d2a10;font-weight:900}
.nav-group{margin:12px 0 18px}
.nav-label{padding:0 10px 7px;color:#9cac9f;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;min-height:41px;margin:2px 0;padding:9px 10px;border:0;width:100%;border-radius:10px;background:transparent;color:#dbe2dc;text-decoration:none;font-size:13px;font-weight:620;cursor:pointer;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.06)}
.nav-item.active{background:#f1dfbd;color:#322413}
.nav-icon{width:18px;text-align:center;opacity:.92;flex:0 0 auto}
.nav-item>span:nth-child(2){min-width:0}
.nav-meta{margin-left:auto;min-width:19px;padding:1px 5px;border-radius:999px;background:rgba(255,255,255,.09);font-size:12px;text-align:center}
.nav-item.active .nav-meta{background:rgba(50,36,19,.09)}
#navigation{flex:1;min-height:0}
.sidebar-footer{margin-top:auto;padding:13px 10px;border-top:1px solid rgba(255,255,255,.1);color:#aebbb1;font-size:12px}
.mobile-topbar{display:none}
.main{min-width:0}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.88);backdrop-filter:blur(14px);position:sticky;top:0;z-index:30}
.crumb{color:var(--text-3);font-size:13px}
.top-actions{display:flex;align-items:center;gap:10px}
.search-wrap{position:relative}
.search{width:250px;padding:9px 34px 9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-subtle);color:var(--text-2)}
.search-key{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-3);border:1px solid var(--border);border-radius:5px;padding:1px 4px;background:white}
.avatar{width:34px;height:34px;border:0;border-radius:50%;display:grid;place-items:center;background:#ded9cc;color:#4a4437;font-size:12px;font-weight:800;cursor:pointer}
.content{max-width:1500px;margin:0 auto;padding:32px 34px 72px}
.page-head{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;margin-bottom:23px}
.page-head-copy{min-width:0}
h1{margin:0;font-size:clamp(25px,3vw,34px);letter-spacing:-.035em;line-height:1.15}
.subhead{margin:8px 0 0;color:var(--text-3);font-size:14px;max-width:760px}
.head-actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:flex-end}
.btn{min-height:41px;border-radius:10px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;font-weight:720;font-size:13px;cursor:pointer;text-decoration:none;transition:transform .15s ease,background .15s ease,border-color .15s ease}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:white;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 5px rgba(74,42,8,.18)}
.btn-primary:hover{background:var(--brand-dark)}
.btn-secondary{color:var(--text-2);background:var(--surface);border-color:var(--border)}
.btn-secondary:hover{background:var(--surface-hover);border-color:var(--border-dark)}
.btn-ghost{color:var(--text-2);background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-hover)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:#e7b3b3}
.btn-sm{min-height:35px;padding:7px 10px;font-size:12px}
.icon-btn{width:39px;padding:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-padded{padding:19px}
.card-title{margin:0;font-size:15px;letter-spacing:-.01em}
.card-subtitle{margin:5px 0 0;color:var(--text-3);font-size:12px}
.section-head{padding:18px 19px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--border-light)}
.section-head h2{margin:0;font-size:16px;letter-spacing:-.015em}
.section-head p{margin:5px 0 0;color:var(--text-3);font-size:12px}
.section-actions{display:flex;flex-wrap:wrap;gap:8px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--border-light);background:var(--surface-subtle)}
.toolbar-group{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.toolbar-spacer{flex:1}
.input,.select,.textarea{border:1px solid var(--border);border-radius:9px;background:white;color:var(--text);padding:9px 10px;min-height:39px}
.input:focus,.select:focus,.textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 32%,transparent);border-color:var(--brand)}
.input-search{min-width:230px}
.chip{min-height:34px;border:1px solid var(--border);border-radius:999px;background:white;color:var(--text-2);padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--surface-hover)}
.chip.active{background:var(--brand-light);color:var(--brand-dark);border-color:#dfc28a}
.chip--attention.active{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border)}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--surface-subtle);color:var(--text-2);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;white-space:nowrap}
.badge.warning{border-color:var(--warning-border);background:var(--warning-bg);color:var(--warning)}
.badge.danger{border-color:var(--danger-border);background:var(--danger-bg);color:var(--danger)}
.badge.success{border-color:var(--success-border);background:var(--success-bg);color:var(--success)}
.badge.info{border-color:var(--info-border);background:var(--info-bg);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:0 0 auto}
.dot.daily{background:var(--daily)}.dot.online{background:var(--online)}.dot.warn{background:var(--warning-border)}.dot.danger{background:var(--danger-border)}.dot.success{background:var(--success-border)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 19px 17px;min-width:0}
.stat.warning{border-color:#ead7a8;background:linear-gradient(180deg,#fff 0%,#fffdf7 100%)}
.stat-label{color:var(--text-3);font-size:12px;font-weight:820;text-transform:uppercase;letter-spacing:.08em}
.stat-value{margin-top:9px;font-variant-numeric:tabular-nums;font-size:28px;font-weight:770;letter-spacing:-.035em}
.stat-detail{margin-top:4px;color:var(--text-2);font-size:12px}
.stat.warning .stat-detail{color:var(--warning)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.golden{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.stack{display:grid;gap:15px}
.area-card{background:white;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;text-decoration:none;color:inherit;transition:transform .16s ease}
.area-card:hover{transform:translateY(-2px)}
.area-card.online{border-left:5px solid var(--online)}
.area-card.daily{border-left:5px solid var(--daily)}
.area-card.ops{border-left:5px solid var(--ops)}
.area-head{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;font-size:12px;font-weight:840;letter-spacing:.08em;text-transform:uppercase}
.online .area-head{background:var(--online-bg);color:#42576b}.daily .area-head{background:var(--daily-bg);color:#345047}.ops .area-head{background:var(--ops-bg);color:#654f35}
.area-body{display:flex;gap:13px;align-items:center;padding:17px 16px}
.area-copy{min-width:0;flex:1}.area-copy strong{display:block;font-size:14px}.area-copy span{display:block;color:var(--text-2);font-size:12px;margin-top:4px}
.area-attention-icon{width:41px;height:41px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;background:var(--warning-bg);color:var(--warning);font-weight:900}
.arrow{color:var(--text-2);font-size:12px;font-weight:760;white-space:nowrap}
.callouts{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.callout{border-radius:12px;border:1px solid;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;gap:15px;text-decoration:none}
.callout.info{background:var(--info-bg);color:var(--info);border-color:var(--info-border)}
.callout.warning{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border)}
.callout.danger{background:var(--danger-bg);color:var(--danger);border-color:#ebb0b0}
.callout.success{background:var(--success-bg);color:var(--success);border-color:var(--success-border)}
.callout strong{font-size:13px;display:block}.callout p{margin:4px 0 0;font-size:12px;opacity:.86}.callout .cta{font-size:12px;font-weight:800;white-space:nowrap}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse;min-width:760px}
.table th{padding:10px 14px;text-align:left;color:var(--text-3);font-size:12px;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border-light);background:var(--surface-subtle);white-space:nowrap}
.table td{padding:13px 14px;border-bottom:1px solid var(--border-light);font-size:12px;vertical-align:middle}
.table tr:last-child td{border-bottom:0}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:var(--surface-hover)}
.primary-cell strong{display:block;font-size:13px}.primary-cell span{display:block;color:var(--text-3);font-size:12px;margin-top:2px}
.row-actions{display:flex;justify-content:flex-end;gap:6px}
.empty{padding:48px 24px;text-align:center;color:var(--text-2)}
.empty-icon{width:57px;height:57px;border-radius:18px;display:grid;place-items:center;margin:0 auto 14px;background:var(--surface-subtle);border:1px solid var(--border);font-size:24px}
.empty strong{display:block;color:var(--text);font-size:15px}.empty p{max-width:480px;margin:7px auto 16px;font-size:13px;color:var(--text-3)}
.list-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border-light);cursor:pointer}
.list-row:last-child{border-bottom:0}.list-row:hover{background:var(--surface-hover)}
.list-time{font-size:13px;font-weight:770;color:var(--text-2);display:flex;align-items:center;gap:7px}
.list-main{min-width:0}.list-main strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-main span{display:block;color:var(--text-3);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-tags{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--border-light);color:var(--text-3);font-size:12px}
.calendar-shell{display:grid;grid-template-columns:72px repeat(6,minmax(150px,1fr));min-width:1070px}
.calendar-corner,.calendar-day-head{position:sticky;top:0;z-index:3;background:var(--surface-subtle);border-bottom:1px solid var(--border);padding:11px;text-align:center}
.calendar-corner{left:0;z-index:4}.calendar-day-head strong{font-size:12px;display:block}.calendar-day-head span{font-size:12px;color:var(--text-3)}
.calendar-time{position:sticky;left:0;z-index:2;background:white;border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light);padding:10px 8px;color:var(--text-3);font-size:12px;text-align:right;height:76px}
.calendar-cell{position:relative;height:76px;border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light);padding:5px}
.cal-event{height:100%;border-radius:8px;padding:7px 8px;font-size:12px;overflow:hidden;border-left:4px solid var(--daily);background:#eef5f2;color:#29463c;cursor:pointer}
.cal-event strong{display:block;font-size:12px}.cal-event span{display:block;margin-top:2px;opacity:.8}
.cal-event.open{background:#fff7e8;color:#704b09;border-left-color:var(--warning-border);border:1px dashed var(--warning-border);border-left-width:4px}
.cal-event.block{background:#f1f1ef;color:#60655f;border-left-color:#8b918a;background-image:repeating-linear-gradient(-45deg,transparent,transparent 5px,rgba(100,105,100,.07) 5px,rgba(100,105,100,.07) 10px)}
.mobile-agenda{display:none}
.agenda-day{margin-bottom:15px}.agenda-day h3{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin:0 0 7px}
.agenda-item{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-light)}
.agenda-item:last-child{border-bottom:0}.agenda-time{font-weight:770;font-size:12px}.agenda-copy strong{font-size:13px;display:block}.agenda-copy span{font-size:12px;color:var(--text-3);display:block;margin-top:2px}
.profile-card{display:flex;gap:13px;align-items:flex-start;padding:17px}
.profile-avatar{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--brand-light);color:var(--brand-dark);font-weight:850;flex:0 0 auto}
.profile-main{min-width:0;flex:1}.profile-main h3{margin:0;font-size:14px}.profile-main p{margin:3px 0;color:var(--text-3);font-size:12px}.profile-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.progress{height:8px;border-radius:999px;background:var(--bg-2);overflow:hidden}.progress>span{display:block;height:100%;border-radius:inherit;background:var(--brand)}
.check-list{display:grid;gap:9px}.check-row{display:flex;align-items:flex-start;gap:9px;font-size:12px}.check-icon{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);font-size:12px;flex:0 0 auto}.check-icon.open{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border)}
.service-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px auto;gap:10px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--border-light)}
.service-row:last-child{border-bottom:0}.service-row strong{font-size:13px}.service-row span{font-size:12px;color:var(--text-3)}
.schedule-grid{display:grid;grid-template-columns:150px repeat(5,minmax(120px,1fr));min-width:800px}
.schedule-head,.schedule-staff,.schedule-cell{padding:11px;border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light)}
.schedule-head{background:var(--surface-subtle);font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.schedule-staff{font-size:12px;font-weight:740;background:white}
.schedule-cell{font-size:12px;color:var(--text-2);background:white}
.time-block{display:inline-block;border:1px solid var(--border);border-radius:7px;padding:4px 6px;background:var(--surface-subtle)}
.preview-shell{background:#eceae3;border-radius:16px;padding:18px}
.browser{background:white;border:1px solid #d7d9d3;border-radius:13px;overflow:hidden;box-shadow:0 12px 40px rgba(30,35,30,.12)}
.browser-bar{height:34px;background:#f2f2ef;border-bottom:1px solid #dedfd9;display:flex;align-items:center;gap:5px;padding:0 10px}.browser-dot{width:8px;height:8px;border-radius:50%;background:#d2d2cd}.browser-url{margin-left:8px;flex:1;height:19px;border-radius:6px;background:white;border:1px solid #dddeda;color:var(--text-3);font-size:12px;padding:3px 8px}
.site-preview{padding:30px;min-height:320px;background:linear-gradient(135deg,#f5efe6,#fbfaf7)}.site-preview h3{font-family:Georgia,serif;font-size:28px;margin:0 0 8px;color:#3b3023}.site-preview p{max-width:430px;color:#776958;font-size:12px}.site-cta{display:inline-block;margin-top:13px;border:0;border-radius:999px;background:#7b4d20;color:white;padding:10px 15px;font-weight:760;font-size:12px}
.widget-preview{max-width:380px;margin:0 auto;background:white;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.widget-head{padding:20px;background:#27332b;color:white}.widget-head h3{margin:0}.widget-body{padding:18px}.widget-step{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border-light)}.widget-step:last-child{border-bottom:0}.widget-step-num{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--brand-light);color:var(--brand-dark);font-size:12px;font-weight:850}
.bar-chart{height:230px;display:flex;align-items:flex-end;gap:12px;padding:20px 8px 0;border-bottom:1px solid var(--border)}.bar{flex:1;min-width:24px;background:linear-gradient(180deg,var(--brand),var(--brand-dark));border-radius:8px 8px 2px 2px;position:relative}.bar span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text-3)}.bar em{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-style:normal;font-size:12px;color:var(--text-2)}
.settings-list{display:grid}.settings-row{display:flex;align-items:center;gap:13px;padding:15px 17px;border-bottom:1px solid var(--border-light);cursor:pointer}.settings-row:last-child{border-bottom:0}.settings-row:hover{background:var(--surface-hover)}.settings-icon{width:38px;height:38px;border-radius:11px;background:var(--surface-subtle);border:1px solid var(--border);display:grid;place-items:center}.settings-copy{flex:1}.settings-copy strong{display:block;font-size:13px}.settings-copy span{display:block;font-size:12px;color:var(--text-3);margin-top:2px}
.demo-panel{position:fixed;right:18px;bottom:18px;z-index:50;width:min(390px,calc(100vw - 36px));background:rgba(32,41,35,.97);color:white;border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.2);padding:13px}
.demo-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.demo-panel strong{font-size:13px}.demo-panel p{margin:3px 0 0;color:#bdc8c0;font-size:12px}.demo-close{background:transparent;border:0;color:#dfe7e0;cursor:pointer;font-size:18px}
.state-buttons{display:flex;flex-wrap:wrap;gap:7px}.state-btn{border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.07);color:#f4f7f4;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:12px}.state-btn.active{background:#f1dfbd;color:#332515;border-color:#f1dfbd}
.demo-open{position:fixed;right:18px;bottom:18px;z-index:40;border:0;background:#202923;color:white;border-radius:999px;padding:11px 15px;font-weight:760;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.2);display:none}

/* CARD-SAFE-INSET START */
:root{
  --card-inset:20px;
  --card-inset-compact:16px;
}

/* Every card-like surface receives a predictable breathing zone. */
.card-padded,
.analytics-decision__lead,
.analytics-decision__metric,
.decision-panel,
.duplicate-box,
.preview-shell,
.widget-head,
.widget-body{
  padding:var(--card-inset);
}

/* Full-bleed card regions keep their separators, but their content no longer hugs the edge. */
.section-head{padding:var(--card-inset)}
.toolbar{padding:16px var(--card-inset)}
.table th,.table td{padding:14px var(--card-inset)}
.list-row{padding:16px var(--card-inset)}
.service-row{padding:16px var(--card-inset)}
.settings-row{padding:16px var(--card-inset)}
.bulk-bar{padding:12px var(--card-inset)}
.legend{padding:12px var(--card-inset)}
.pagination{padding:16px var(--card-inset)}
.area-body{padding:20px var(--card-inset)}
.callout{padding:var(--card-inset)}
.empty{padding:48px var(--card-inset)}
.today-priority-item{padding:16px var(--card-inset)}
.today-upcoming-row{padding:14px var(--card-inset)}
.today-rail-footer{padding:16px var(--card-inset)}
.mobile-record-card{padding:16px var(--card-inset)}
.mobile-schedule-card{padding:var(--card-inset)}
.profile-card{padding:var(--card-inset)}
.compact-summary-item{padding:16px var(--card-inset)}
.today-overview-cell{padding:16px var(--card-inset)}
.status-axis{padding:var(--card-inset-compact)}
.detail-box{padding:var(--card-inset-compact)}

/* Preview cards use the same horizontal inset as product cards. */
.browser-bar{padding-inline:var(--card-inset-compact)}
.site-preview{padding:32px var(--card-inset)}
.widget-step{padding:12px 0}

/* Card-contained schedules and records keep at least one inset before the first readable element. */
.mobile-schedule-days{gap:8px}
.mobile-schedule-days>div{padding:8px}
.agenda-item{padding:12px 0}

@media(max-width:620px){
  :root{--card-inset:16px;--card-inset-compact:16px}

}
/* CARD-SAFE-INSET END */

function calendarGrid(empty,attention){
 const days=[['Mo','20.07.'],['Di','21.07.'],['Mi','22.07.'],['Do','23.07.'],['Fr','24.07.'],['Sa','25.07.']];
 const times=['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
 let html=`<div class="calendar-shell"><div class="calendar-corner"></div>${days.map(d=>`<div class="calendar-day-head"><strong>${d[0]}</strong><span>${d[1]}</span></div>`).join('')}`;
 times.forEach((t,ri)=>{html+=`<div class="calendar-time">${t}</div>`;days.forEach((d,ci)=>{
  let event='';

   if((ri+ci)%4===1){const b=(ri+ci)%bookings.length+1;event=`<button type="button" class="cal-event" onclick="openBookingDrawer(${b})"><strong>${['Anna','Lea','Nina','Sofia'][ci%4]}</strong><span>${['Schnitt','Balayage','Farbe','Styling'][ri%4]}</span></button>`}

   if(attention&&ri===2&&ci===3)event=`<button type="button" class="cal-event open" onclick="openBookingDrawer(6)"><strong>Offene Anfrage</strong><span>Jonas Wyss</span></button>`;
  }
  html+=`<div class="calendar-cell">${event}</div>`;
 });});
 return html+`</div>`;
}

function startDemoScan(){

function resumeScanTimer(){

 scanTimer=setInterval(()=>{scanPhase++;demoStorage.setItem('gwsDemoScanPhase',String(scanPhase));updateScanIndicator();if(activePage==='website')renderPage();if(scanPhase>=5){clearInterval(scanTimer);scanTimer=null;demoToast('Website-Prüfung abgeschlossen.');}},1300);
}
function pauseDemoScan(){if(scanTimer){clearInterval(scanTimer);scanTimer=null;demoToast('Scan pausiert. Er kann später fortgesetzt werden.')}else{resumeScanTimer();demoToast('Scan fortgesetzt.')}}

function renderCommandResults(q){
 const entries=commandEntries(q);window.__commandEntries=entries;commandIndex=Math.min(commandIndex,Math.max(entries.length-1,0));
 let group='';
 document.getElementById('commandResults').innerHTML=entries.length?entries.map((x,i)=>`${x.group!==group?(group=x.group,`<div class="command-group">${x.group}</div>`):''}<button class="command-item ${i===commandIndex?'active':''}" onclick="runCommand(${i})"><span class="command-item-icon">${icon(x.icon)}</span><span class="command-item-copy"><strong>${escapeHtml(x.title)}</strong><span>${escapeHtml(x.sub)}</span></span><span class="arrow">↵</span></button>`).join(''):`<div class="empty" style="padding:28px"><strong>Kein Ergebnis</strong><p>Suche nach Kunde, Termin, Team, Leistung, Standort oder Aktion.</p></div>`;

function commandKeydown(e){
 const entries=window.__commandEntries||[];
 if(e.key==='ArrowDown'){e.preventDefault();commandIndex=Math.min(commandIndex+1,entries.length-1);renderCommandResults(e.target.value)}
 if(e.key==='ArrowUp'){e.preventDefault();commandIndex=Math.max(commandIndex-1,0);renderCommandResults(e.target.value)}
 if(e.key==='Enter'&&entries.length){e.preventDefault();runCommand(commandIndex)}
 if(e.key==='Escape')closeCommandPalette();
}
function runCommand(i){const item=(window.__commandEntries||[])[i];if(item){closeCommandPalette();item.run()}}

let lastFocusedElement=null;
let activeDialog=null;
function focusableElements(root){return [...root.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(el=>!el.hidden&&el.offsetParent!==null)}
function activateDialog(root,preferred){lastFocusedElement=document.activeElement;activeDialog=root;root.closest('.backdrop,.modal-wrap,.command-wrap')?.classList.add('open');setTimeout(()=>{const target=preferred||focusableElements(root)[0]||root;target.focus()},0)}
function deactivateDialog(wrapper){wrapper.classList.remove('open');activeDialog=null;const target=lastFocusedElement;lastFocusedElement=null;if(target&&document.contains(target))setTimeout(()=>target.focus(),0)}
function trapDialogFocus(e){if(e.key!=='Tab'||!activeDialog)return;const items=focusableElements(activeDialog);if(!items.length){e.preventDefault();activeDialog.focus();return}const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}

function openDrawer(title,subtitle,body,footer=''){
 document.getElementById('drawer').innerHTML=`<div class="drawer-head"><div><h3 id="drawerTitle">${title}</h3><p>${subtitle}</p></div><button class="drawer-close" onclick="closeDrawer()" aria-label="Detailansicht schliessen">${icon('close')}</button></div><div class="drawer-body">${body}</div><div class="drawer-footer">${footer||`<button class="btn btn-secondary" onclick="closeDrawer()">Schliessen</button>`}</div>`;
 activateDialog(document.getElementById('drawer'),document.querySelector('.drawer-close'));
}
function closeDrawer(){deactivateDialog(document.getElementById('drawerBackdrop'))}
function drawerBackdropClose(e){if(e.target.id==='drawerBackdrop')closeDrawer()}
function openBookingDrawer(id){
 const b=bookings.find(x=>x.id===id)||bookings[0];
 const isPast=b.phase==='past';
 const isRequest=b.status==='Anfrage';
 const contactOk=!b.dataIssue;
 let footer='';
 if(isPast&&b.status!=='Erledigt'&&b.status!=='No-Show'&&b.status!=='Abgesagt'){
  footer=`<button class="btn btn-secondary" onclick="demoToast('Termin als erledigt markiert.','Rückgängig')">Erledigt</button><button class="btn btn-danger" onclick="demoToast('Termin als No-Show markiert.','Rückgängig')">No-Show</button>`;
 }else if(isRequest){
  footer=`<button class="btn btn-primary" onclick="demoToast('Anfrage bestätigt.','Rückgängig')">Bestätigen</button><button class="btn btn-secondary" onclick="demoToast('Terminverschiebung geöffnet')">Verschieben</button><button class="btn btn-danger" onclick="demoToast('Anfrage abgesagt.','Rückgängig')">Absagen</button>`;
 }else if(!isPast){
  footer=`<button class="btn btn-secondary" onclick="demoToast('Termin bearbeiten')">Bearbeiten</button><button class="btn btn-secondary" onclick="demoToast('Terminverschiebung geöffnet')">Verschieben</button><button class="btn btn-danger" onclick="demoToast('Absage vorbereitet')">Absagen</button>`;
 }else{
  footer=`<button class="btn btn-secondary" onclick="closeDrawer()">Schliessen</button>`;
 }
 openDrawer(b.name,`${b.date} · ${b.time} · ${b.status}`,`${b.dataIssue?`<div class="callout warning" style="margin-bottom:14px"><div><strong>Datenqualität prüfen</strong><p>Name, Telefonnummer oder E-Mail sind unvollständig. Der Termin bleibt nutzbar, aber die Korrektur wird empfohlen.</p></div></div>`:''}<div class="detail-grid"><div class="detail-box"><span>Leistung</span><strong>${b.service}</strong></div><div class="detail-box"><span>Dauer</span><strong>${b.duration}</strong></div><div class="detail-box"><span>Mitarbeitende</span><strong>${b.staff}</strong></div><div class="detail-box"><span>Terminstatus</span><strong>${b.status}</strong></div></div><div class="card card-padded" style="margin-top:14px;box-shadow:none"><h3 class="card-title">Kontakt aufnehmen</h3><p class="card-subtitle"><a href="${contactOk?'tel:'+b.phone.replace(/\s/g,''):'#'}">${b.phone}</a><br><a href="${contactOk?'mailto:'+b.email:'#'}">${b.email}</a></p><div style="display:flex;gap:8px;margin-top:12px"><a class="btn btn-secondary btn-sm" href="${contactOk?'tel:'+b.phone.replace(/\s/g,''):'#'}">Anrufen</a><a class="btn btn-secondary btn-sm" href="${contactOk?'mailto:'+b.email:'#'}">E-Mail</a><button class="btn btn-secondary btn-sm" onclick="demoToast('Nachricht vorbereitet')">Nachricht</button></div></div><div class="card card-padded" style="margin-top:14px;box-shadow:none"><h3 class="card-title">Notiz</h3><p class="card-subtitle">${b.note||'Keine Notiz vorhanden.'}</p><button class="btn btn-ghost btn-sm" style="margin-top:9px" onclick="demoToast('Notiz bearbeiten')">Notiz bearbeiten</button></div>`,footer);
}
function openCustomerDrawer(id){
 const c=customers.find(x=>x.id===id)||customers[0];
 openDrawer(c.name,`${c.visits} Besuche · zuletzt ${c.last}`,`${c.dataIssue?`<div class="callout warning" style="margin-bottom:14px"><div><strong>Plausibilitätsprüfung</strong><p>Name oder Kontaktangaben wirken unvollständig. Nicht blockiert, aber sichtbar zur Korrektur markiert.</p></div></div>`:''}<div class="detail-grid"><div class="detail-box"><span>Telefon</span><strong><a href="${c.dataIssue?'#':'tel:'+c.contact.replace(/\s/g,'')}">${c.contact}</a></strong></div><div class="detail-box"><span>E-Mail</span><strong><a href="${c.dataIssue?'#':'mailto:'+c.email}">${c.email}</a></strong></div><div class="detail-box"><span>Kundenwert</span><strong>${c.value}</strong></div><div class="detail-box"><span>Datenstatus</span><strong>${c.status}</strong></div></div><div class="card card-padded" style="margin-top:14px;box-shadow:none"><h3 class="card-title">Letzte Termine</h3>${bookings.slice(0,3).map(b=>`<div class="agenda-item"><div class="agenda-time">${b.date}</div><div class="agenda-copy"><strong>${b.service}</strong><span>${b.staff} · ${b.price}</span></div></div>`).join('')}</div>`,`<button class="btn btn-secondary" onclick="demoToast('Kunde bearbeiten')">Bearbeiten</button><button class="btn btn-primary" onclick="openModal('Neue Buchung',bookingForm())">Buchung erstellen</button>`);
}
function openStaffDrawer(id){
 const s=staff.find(x=>x.id===id)||staff[0];
 openDrawer(s.name,s.role,`<div class="detail-grid"><div class="detail-box"><span>Standorte</span><strong>${s.locations}</strong></div><div class="detail-box"><span>Buchbarkeit</span><strong>${s.status}</strong></div></div><div class="card card-padded" style="margin-top:14px;box-shadow:none"><h3 class="card-title">Leistungen</h3><p class="card-subtitle">${s.services}</p></div><div class="card card-padded" style="margin-top:14px;box-shadow:none"><h3 class="card-title">Nächste Arbeitszeit</h3><p class="card-subtitle">Montag, 08:30–17:30 · Grenchen</p></div>`,`<button class="btn btn-secondary" onclick="demoToast('Leistungen zuordnen')">Leistungen zuordnen</button><button class="btn btn-primary" onclick="demoToast('Profil bearbeiten')">Bearbeiten</button>`);
}
function openModal(title,body){
 document.getElementById('modal').innerHTML=`<div class="modal-head"><h3 id="modalTitle">${title}</h3><button class="modal-close" onclick="closeModal()" aria-label="Dialog schliessen">${icon('close')}</button></div>${body}`;
 activateDialog(document.getElementById('modal'),document.querySelector('#modal input,#modal select,#modal button'));
}
function closeModal(){deactivateDialog(document.getElementById('modalWrap'))}
function modalBackdropClose(e){if(e.target.id==='modalWrap')closeModal()}
function formActions(label='Speichern'){return `<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button><button class="btn btn-primary" onclick="saveDemo('${label} wurde in der Demo ausgeführt.')">${label}</button></div>`}
function bookingForm(){return `<div class="field"><label>Kundin oder Kunde</label><input aria-label="Kundin oder Kunde" value="Mia Baumann"></div><div class="field"><label>Leistung</label><select aria-label="Leistung"><option>Waschen, Schneiden, Föhnen · 60 Min.</option><option>Balayage · 180 Min.</option></select></div><div class="field"><label>Mitarbeitende</label><select aria-label="Mitarbeitende"><option>Belinda</option><option>Elma</option><option>Laura</option></select></div><div class="field"><label>Datum und Zeit</label><input aria-label="Datum und Zeit" value="21.07.2026 · 09:30"></div>${formActions('Buchung anlegen')}`}
function blockForm(){return `<div class="field"><label>Mitarbeitende</label><select aria-label="Mitarbeitende"><option>Belinda</option><option>Elma</option><option>Laura</option></select></div><div class="field"><label>Grund</label><select aria-label="Grund der blockierten Zeit"><option>Pause</option><option>Schulung</option><option>Interner Termin</option><option>Sonstiges</option></select></div><div class="field"><label>Zeitraum</label><input aria-label="Zeitraum" value="13:00–13:30"></div>${formActions('Zeit reservieren')}`}
function customerForm(){return `<div class="field"><label>Name</label><input aria-label="Name" value="Mia Baumann" minlength="2"><small style="color:var(--text-3)">Kurze oder unvollständige Namen werden zur Prüfung markiert, nicht aggressiv blockiert.</small></div><div class="field"><label>Telefon</label><input aria-label="Telefon" value="+41 79 000 00 00"></div><div class="field"><label>E-Mail</label><input aria-label="E-Mail" value="mia@example.ch"></div>${formActions('Kunde speichern')}`}
function serviceForm(){return `<div class="field"><label>Name der Leistung</label><input aria-label="Name der Leistung" value="Glossing"></div><div class="field"><label>Kategorie</label><select aria-label="Kategorie"><option>Coloration</option><option>Damen</option><option>Herren</option></select></div><div class="grid-2"><div class="field"><label>Dauer</label><input aria-label="Dauer" value="60 Min."><small style="color:var(--warning)">Vorschlag aus Kategorie, Teilleistungen und Salonkontext — bitte prüfen.</small></div><div class="field"><label>Preis</label><input aria-label="Preis" value="CHF 95"></div></div>${formActions('Leistung speichern')}`}
function staffForm(){return `<div class="field"><label>Name</label><input aria-label="Name" value="Mia Baumann"></div><div class="field"><label>Rolle</label><input aria-label="Rolle" value="Stylistin"></div><div class="field"><label>Standort</label><select aria-label="Standort"><option>Grenchen</option><option>Solothurn</option></select></div>${formActions('Mitarbeitende speichern')}`}
function locationForm(){return `<div class="field"><label>Name</label><input aria-label="Standortname" value="Biel"></div><div class="field"><label>Adresse</label><input aria-label="Adresse" value="Bahnhofstrasse 10, 2502 Biel"></div>${formActions('Standort speichern')}`}
function availabilityForm(){return `<div class="field"><label>Mitarbeitende</label><select aria-label="Mitarbeitende"><option>Belinda</option><option>Elma</option></select></div><div class="field"><label>Wochentag</label><select aria-label="Wochentag"><option>Montag</option><option>Dienstag</option></select></div><div class="field"><label>Arbeitszeit</label><input aria-label="Arbeitszeit" value="08:30–17:30"></div>${formActions('Arbeitszeit speichern')}`}
function absenceForm(){return `<div class="field"><label>Art</label><select aria-label="Art der Abweichung"><option>Ferien</option><option>Schulung</option><option>Krankheit</option></select></div><div class="field"><label>Zeitraum</label><input aria-label="Zeitraum" value="24.07.2026–31.07.2026"></div>${formActions('Abweichung speichern')}`}
function scanForm(){return `<div class="field"><label>Website-Adresse</label><input aria-label="Website-Adresse" value="https://salon-lumiere.ch"></div><div class="callout info"><div><strong>Ehrlicher, wiederaufnehmbarer Prozess</strong><p>Phasen statt künstlichem Prozentwert. Ein zweiter Scan wird verhindert, solange die Prüfung läuft.</p></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button><button class="btn btn-primary" onclick="closeModal();startDemoScan()">Prüfung starten</button></div>`}
function websiteForm(){return `<div class="field"><label>Website-Adresse</label><input aria-label="Website-Adresse" value="https://salon-lumiere.ch"></div>${formActions('Website verbinden')}`}
function saveDemo(message,undoLabel=''){
 closeModal();demoToast(message,undoLabel);
}
function demoToast(message,undoLabel=''){
 const t=document.getElementById('toast');
 t.innerHTML=undoLabel?`<span class="undo-toast"><span>${escapeHtml(message)}</span><button onclick="demoToast('Änderung rückgängig gemacht.')">${escapeHtml(undoLabel)}</button></span>`:escapeHtml(message);
 t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),3200);return false;
}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function closeDemoPanel(){document.getElementById('demoPanel').style.display='none'}
function openDemoPanel(){document.getElementById('demoPanel').style.display='block'}
function globalSearch(e){
 if(e.key==='Enter'){openCommandPalette();const q=e.target.value.trim();document.getElementById('commandSearch').value=q;renderCommandResults(q)}
 if(e.key==='Escape')e.target.blur();
}
document.addEventListener('click',e=>{if(!e.target.closest('.profile-menu')&&!e.target.closest('.avatar')&&!e.target.closest('.mobile-avatar'))closeProfileMenu()})
document.addEventListener('keydown',e=>{trapDialogFocus(e);if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommandPalette()}if(e.key==='Escape'){closeDrawer();closeModal();closeCommandPalette();document.getElementById('sidebar').classList.remove('open')}})
renderNavigation();renderPage();
</script>
</body>
</html>
